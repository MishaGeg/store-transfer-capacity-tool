<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ტევადობების რედაქტირება</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap');

        :root {
            --black: #111111;
            --white: #ffffff;
            --off-white: #fafaf9;
            --g50: #f7f6f4;
            --g100: #edece8;
            --g200: #dddbd5;
            --g300: #b8b6b0;
            --g400: #8a8884;
            --g500: #6b6966;
            --g600: #4a4845;
            --g700: #2d2c2a;

            --accent: #c8102e;
            --accent-dk: #a30d24;
            --accent-light: #fef2f2;

            --danger: #dc0000;
            --danger-light: #ffe0e0;
            --success: #1a6b35;
            --success-light: #ecfdf5;

            --font: "Noto Sans Georgian", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --border: var(--g200);
            --border-strong: var(--g300);
            --surface: var(--white);
            --surface-subtle: var(--g50);
            --text: var(--g700);
            --text-muted: var(--g500);
            --radius-sm: 5px;
            --radius-md: 7px;
            --shadow-card: 0 1px 2px rgba(17, 17, 17, 0.035), 0 4px 12px rgba(17, 17, 17, 0.025);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            color: var(--text);
            background: transparent;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            opacity: .48;
            cursor: not-allowed;
        }

        .container {
            width: 100%;
            padding: 1rem 0 2rem;
        }

        .header-section {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.6rem;
        }

        h2 {
            display: flex;
            align-items: center;
            gap: .6rem;
            color: var(--black);
            font-size: clamp(1.2rem, 2vw, 1.45rem);
            font-weight: 700;
            letter-spacing: -.035em;
        }

        h2::before {
            content: "";
            width: 3px;
            height: 1.5rem;
            flex: 0 0 auto;
            border-radius: 2px;
            background: var(--accent);
        }

        .action-btn {
            padding: .42rem .7rem;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            background: var(--white);
            color: var(--text);
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
        }

        .action-btn:hover:not(:disabled) {
            background: var(--g50);
        }

        .action-btn:active:not(:disabled) {
            transform: scale(.98);
        }

        .stores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
            gap: .75rem;
            align-items: start;
        }

        .store-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: .85rem .9rem;
            box-shadow: var(--shadow-card);
        }

        .store-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: .6rem;
            margin-bottom: .6rem;
            border-bottom: 1px solid var(--border);
        }

        .store-name {
            min-width: 0;
            overflow-wrap: anywhere;
            font-weight: 700;
            font-size: .85rem;
            color: var(--black);
        }

        .store-name::before {
            content: "მაღაზია";
            display: block;
            margin-bottom: .15rem;
            color: var(--text-muted);
            font-size: .62rem;
            font-weight: 700;
            letter-spacing: .075em;
            text-transform: uppercase;
        }

        .brands-list {
            display: flex;
            flex-direction: column;
            gap: .4rem;
        }

        .brand-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            align-items: center;
            gap: .5rem;
            padding: .45rem .6rem;
            background: var(--g50);
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            transition: border-color .15s ease, background .15s ease;
        }

        .brand-row:hover {
            border-color: var(--border);
            background: var(--white);
        }

        .brand-info {
            min-width: 0;
        }

        .brand-label {
            color: var(--text-muted);
            font-size: 8px;
            font-weight: 700;
            letter-spacing: .075em;
            text-transform: uppercase;
            margin-bottom: .05rem;
        }

        .brand-name {
            color: var(--text);
            font-size: 11px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .capacity-value {
            padding: .2rem .4rem;
            border-radius: 4px;
            background: #dcfce7;
            color: #15803d;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .row-edit-btn {
            padding: .3rem .5rem;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            background: var(--white);
            color: var(--text);
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
        }

        .row-edit-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--white);
        }

        /* Modal styling matching system components */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            padding: 1rem;
            background: rgba(17, 17, 17, 0.4);
            backdrop-filter: blur(2px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1.15rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(17, 17, 17, 0.1);
        }

        .modal-header {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: transparent;
            border: 0;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            padding: .2rem;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--danger);
        }

        .form-group {
            margin-bottom: .8rem;
        }

        .form-group label {
            display: block;
            font-size: .68rem;
            color: var(--text-muted);
            margin-bottom: .3rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        .form-group input {
            width: 100%;
            height: 32px;
            padding: .3rem .5rem;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            background: var(--off-white);
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(200, 16, 46, .10);
        }

        .form-group input[readonly] {
            background: var(--g100);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .error-msg {
            color: var(--danger);
            font-size: 10px;
            margin-top: .25rem;
        }

        .modal-footer {
            display: flex;
            gap: .5rem;
            justify-content: flex-end;
            margin-top: 1rem;
            padding-top: .75rem;
            border-top: 1px solid var(--border);
        }

        .loading,
        .empty-state {
            grid-column: 1 / -1;
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            padding: 2rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header-section">
            <h2>მაღაზიების ტევადობები</h2>
            <a href="/transfers-page" class="action-btn">ტრანსფერებზე გადასვლა</a>
        </div>

        <div id="storesContainer" class="stores-grid">
            <div class="loading">იტვირთება მონაცემები...</div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <span>ტევადობის რედაქტირება</span>
                <button class="close-btn" id="closeBtn">&times;</button>
            </div>

            <div class="form-group">
                <label>მაღაზია</label>
                <input type="text" id="storeNameField" readonly>
            </div>

            <div class="form-group">
                <label>ბრენდი</label>
                <input type="text" id="brandField" readonly>
            </div>

            <div class="form-group">
                <label>ტევადობა</label>
                <input type="number" id="capacityField" placeholder="Enter capacity">
                <div class="error-msg" id="errorMsg"></div>
            </div>

            <div class="modal-footer">
                <button class="action-btn" id="cancelBtn">გაუქმება</button>
                <button class="action-btn primary" id="saveBtn"
                    style="background: var(--accent); border-color: var(--accent); color: var(--white);">შენახვა</button>
            </div>
        </div>
    </div>

    <script>
        let capacitiesData = {};
        let currentEdit = null;

        async function apiFetch(url, options = {}) {
            const response = await fetch(url, options);

            if (response.status === 401) {
                window.location.href = '/login';
                throw new Error('Not authenticated');
            }

            let data = null;
            try {
                data = await response.json();
            } catch (err) {
                if (!response.ok) {
                    throw new Error(`Request failed: ${response.status}`);
                }
                throw new Error('Server returned an invalid response.');
            }

            if (!response.ok) {
                throw new Error(data?.error || `Request failed: ${response.status}`);
            }

            return data;
        }

        async function fetchCapacities() {
            try {
                return await apiFetch('/capacity-groups');
            } catch (err) {
                return {};
            }
        }

        function renderStores(data) {
            const container = document.getElementById('storesContainer');

            if (!data || Object.keys(data).length === 0) {
                container.innerHTML = '<div class="empty-state">No capacity data available.</div>';
                return;
            }

            const html = Object.entries(data)
                .map(([storeName, storeData]) => {
                    const storeId = storeData.store_id;
                    const brands = storeData.brands;

                    return `
      <div class="store-card">
        <div class="store-header">
          <div class="store-name">${storeName}</div>
        </div>
        <div class="brands-list">
          ${brands.map(item => `
            <div class="brand-row">
              <div class="brand-info">
                <div class="brand-label">ბრენდი</div>
                <div class="brand-name">${item.brand}</div>
              </div>
              <div class="capacity-value">${item.capacity}</div>
              <button class="row-edit-btn edit-btn" data-store-id="${storeId}" data-store="${storeName}" data-brand="${item.brand}" data-capacity="${item.capacity}">
                შეცვლა
              </button>
            </div>
          `).join('')}
        </div>
      </div>
    `;
                })
                .join('');

            container.innerHTML = html;

            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const storeId = btn.getAttribute('data-store-id');
                    const storeName = btn.getAttribute('data-store');
                    const brand = btn.getAttribute('data-brand');
                    const capacity = btn.getAttribute('data-capacity');
                    openEditModal(storeId, storeName, brand, capacity);
                });
            });
        }

        function openEditModal(storeId, storeName, brand, capacity) {
            currentEdit = { storeId, storeName, brand, capacity };

            document.getElementById('storeNameField').value = storeName;
            document.getElementById('brandField').value = brand;
            document.getElementById('capacityField').value = capacity;
            document.getElementById('errorMsg').textContent = '';

            document.getElementById('modalOverlay').classList.add('open');
            document.getElementById('capacityField').focus();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
            currentEdit = null;
        }

        async function saveCapacity() {
            const errorMsg = document.getElementById('errorMsg');
            const newCapacity = document.getElementById('capacityField').value;

            if (!newCapacity || isNaN(newCapacity)) {
                errorMsg.textContent = 'Enter a valid number.';
                return;
            }

            errorMsg.textContent = '';

            const { storeId, brand } = currentEdit;

            if (!storeId) {
                errorMsg.textContent = 'Store ID not found.';
                return;
            }

            try {
                await apiFetch(
                    `/capacities/${storeId}/${encodeURIComponent(brand)}`,
                    {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ capacity: parseInt(newCapacity) })
                    }
                );

                closeModal();
                const updated = await fetchCapacities();
                capacitiesData = updated;
                renderStores(updated);
            } catch (err) {
                errorMsg.textContent = err.message || 'Network error. Try again.';
            }
        }

        document.getElementById('closeBtn').addEventListener('click', closeModal);
        document.getElementById('cancelBtn').addEventListener('click', closeModal);
        document.getElementById('saveBtn').addEventListener('click', saveCapacity);

        document.getElementById('capacityField').addEventListener('input', () => {
            document.getElementById('errorMsg').textContent = '';
        });

        (async () => {
            const data = await fetchCapacities();
            capacitiesData = data;
            renderStores(data);
        })();
    </script>

</body>

</html>

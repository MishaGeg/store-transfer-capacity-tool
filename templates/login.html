<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>შესვლა</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap');

        :root {
            --black: #111111;
            --white: #ffffff;
            --off-white: #fafaf9;
            --g50: #f7f6f4;
            --g100: #edece8;
            --g200: #dddbd5;
            --g300: #b8b6b0;
            --g400: #8a8884;
            --g500: #6b6966;
            --g600: #4a4845;
            --g700: #2d2c2a;

            --accent: #c8102e;
            --accent-dk: #a30d24;
            --accent-light: #fef2f2;

            --danger: #dc0000;
            --danger-light: #ffe0e0;
            --success: #1a6b35;
            --success-light: #ecfdf5;

            --font: "Noto Sans Georgian", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --border: var(--g200);
            --border-strong: var(--g300);
            --surface: var(--white);
            --surface-subtle: var(--g50);
            --text: var(--g700);
            --text-muted: var(--g500);
            --radius-sm: 5px;
            --radius-md: 7px;
            --shadow-card: 0 1px 2px rgba(17, 17, 17, 0.035), 0 4px 12px rgba(17, 17, 17, 0.025);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: var(--off-white);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        form {
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-card);
            width: 100%;
            max-width: 340px;
        }

        h1 {
            margin: 0 0 1.5rem;
            font-size: 1.35rem;
            color: var(--black);
            font-weight: 700;
            letter-spacing: -.03em;
        }

        label {
            display: block;
            margin-bottom: 0.35rem;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        input {
            width: 100%;
            padding: 0.55rem 0.7rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            background: var(--off-white);
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(200, 16, 46, .10);
            background: var(--surface);
        }

        button {
            width: 100%;
            padding: 0.6rem;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: var(--white);
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        button:hover:not(:disabled) {
            background: var(--accent-dk);
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #error {
            color: var(--danger);
            font-size: 0.825rem;
            margin-bottom: 1rem;
            min-height: 1.2em;
        }
    </style>
</head>

<body>
    <form id="login-form">
        <h1>შესვლა</h1>

        <label for="username">მომხმარებელი</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>

        <label for="password">პაროლი</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <div id="error" role="alert" aria-live="polite"></div>

        <button type="submit" id="submit-btn">შესვლა</button>
    </form>

    <script>
        const form = document.getElementById("login-form");
        const errorBox = document.getElementById("error");
        const submitBtn = document.getElementById("submit-btn");

        form.addEventListener("submit", async (event) => {
            // Stop the browser's default form post; we send JSON instead.
            event.preventDefault();
            errorBox.textContent = "";
            submitBtn.disabled = true;

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password }),
                });

                if (response.ok) {
                    window.location.href = "/transfers-page";
                    return;
                }

                // 400 (missing fields) and 401 (wrong credentials) both carry {"error": "..."}
                const data = await response.json().catch(() => ({}));
                errorBox.textContent = data.error || "შესვლა ვერ მოხერხდა";
            } catch (err) {
                errorBox.textContent = "სერვერთან დაკავშირება ვერ მოხერხდა";
            }

            submitBtn.disabled = false;
        });
    </script>
</body>

</html>

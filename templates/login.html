<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>შესვლა</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f4f5f7;
        }

        form {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 320px;
        }

        h1 {
            margin: 0 0 1.5rem;
            font-size: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.25rem;
            font-size: 0.875rem;
        }

        input {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 0.6rem;
            border: none;
            border-radius: 4px;
            background: #2563eb;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #error {
            color: #b91c1c;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            min-height: 1.2em;
        }
    </style>
</head>

<body>
    <form id="login-form">
        <h1>შესვლა</h1>

        <label for="username">მომხმარებელი</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>

        <label for="password">პაროლი</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <div id="error" role="alert" aria-live="polite"></div>

        <button type="submit" id="submit-btn">შესვლა</button>
    </form>

    <script>
        const form = document.getElementById("login-form");
        const errorBox = document.getElementById("error");
        const submitBtn = document.getElementById("submit-btn");

        form.addEventListener("submit", async (event) => {
            // Stop the browser's default form post; we send JSON instead.
            event.preventDefault();
            errorBox.textContent = "";
            submitBtn.disabled = true;

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password }),
                });

                if (response.ok) {
                    window.location.href = "/transfers-page";
                    return;
                }

                // 400 (missing fields) and 401 (wrong credentials) both carry {"error": "..."}
                const data = await response.json().catch(() => ({}));
                errorBox.textContent = data.error || "შესვლა ვერ მოხერხდა";
            } catch (err) {
                errorBox.textContent = "სერვერთან დაკავშირება ვერ მოხერხდა";
            }

            submitBtn.disabled = false;
        });
    </script>
</body>

</html>

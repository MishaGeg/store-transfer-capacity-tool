                                        <tr>

                                            <th className="corner-head">
                                                საიდან \ სად
                                            </th>


                                            {visibleStores.map(
                                                renderStoreHeader
                                            )}


                                            <th className="actions-head">

                                            </th>

                                        </tr>

                                    </thead>


                                    <tbody>

                                        {visibleStores.map(
                                            fromStore => {

                                                const count =
                                                    rowTransferCount(
                                                        fromStore.id
                                                    );


                                                return (

                                                    <tr
                                                        key={
                                                            fromStore.id
                                                        }
                                                    >

                                                        {/* =================
                                                    ROW NAME
                                                    ================= */}

                                                        <td
                                                            className="row-name-cell"
                                                        >

                                                            <div
                                                                className="store-label"
                                                                title={
                                                                    fromStore.name
                                                                }
                                                            >
                                                                {
                                                                    fromStore.name
                                                                }
                                                            </div>

                                                        </td>


                                                        {/* =================
                                                    TRANSFER CELLS
                                                    ================= */}

                                                        {visibleStores.map(
                                                            (toStore, toIndex) =>
                                                                renderCell(
                                                                    fromStore,
                                                                    toStore,
                                                                    toIndex
                                                                )
                                                        )}


                                                        {/* =================
                                                    ROW DELETE
                                                    ================= */}

                                                        <td
                                                            className="actions-cell"
                                                        >

                                                            <button
                                                                type="button"
                                                                className="row-action-btn"

                                                                disabled={
                                                                    count === 0
                                                                }

                                                                onClick={() =>
                                                                    deleteRowTransfers(
                                                                        fromStore.id
                                                                    )
                                                                }

                                                                title={
                                                                    count
                                                                        ? `Delete all ${count} active transfer(s) in this row`
                                                                        : "No active transfers in this row"
                                                                }
                                                            >
                                                                ტრანსფერის წაშლა
                                                            </button>


                                                            <span className="row-count">
                                                                {count} active
                                                            </span>

                                                        </td>

                                                    </tr>

                                                );
                                            }
                                        )}

                                    </tbody>

                                </table>

                            </div>

                        </div>

                    )}

                </div>
            );
        }


        /* ================================================================
           MOUNT REACT
           ================================================================ */

        ReactDOM
            .createRoot(
                document.getElementById("root")
            )
            .render(
                <App />
            );

    </script>

</body>

</html>

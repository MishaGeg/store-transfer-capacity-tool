                ==================================================== */}

                    {showOrder && (

                        <div className="order-card">

                            <div className="order-header">

                                <span className="section-label">
                                    Store order
                                </span>


                                <button
                                    type="button"
                                    className="action-btn reset-btn"
                                    onClick={resetOrder}
                                >
                                    Reset default
                                </button>

                            </div>


                            <div className="order-list">

                                {stores.map(
                                    (store, index) => (

                                        <div
                                            className="order-item"
                                            key={store.id}
                                        >

                                            <span className="order-number">
                                                {index + 1}
                                            </span>


                                            <span
                                                className="order-name"
                                                title={store.name}
                                            >
                                                {store.name}
                                            </span>


                                            <button
                                                type="button"
                                                className="move-btn"

                                                disabled={
                                                    index === 0
                                                }

                                                onClick={() =>
                                                    moveStore(
                                                        index,
                                                        -1
                                                    )
                                                }

                                                aria-label={
                                                    `Move ${store.name} up`
                                                }

                                                title="Move up"
                                            >
                                                ↑
                                            </button>


                                            <button
                                                type="button"
                                                className="move-btn"

                                                disabled={
                                                    index ===
                                                    stores.length - 1
                                                }

                                                onClick={() =>
                                                    moveStore(
                                                        index,
                                                        1
                                                    )
                                                }

                                                aria-label={
                                                    `Move ${store.name} down`
                                                }

                                                title="Move down"
                                            >
                                                ↓
                                            </button>

                                        </div>

                                    )
                                )}

                            </div>

                        </div>

                    )}


                    {/* ====================================================
                NO STORES
                ==================================================== */}

                    {!stores.length ? (

                        <div className="matrix-card">

                            <div className="empty-state">
                                No stores returned by /stores.
                            </div>

                        </div>

                    ) : !selectedBrand ? (

                        <div className="matrix-card">

                            <div className="empty-state">
                                No brand data available.
                            </div>

                        </div>

                    ) : !visibleStores.length ? (

                        <div className="matrix-card">

                            <div className="empty-state">
                                No stores have capacity configured for {selectedBrand}.
                            </div>

                        </div>

                    ) : (

                        /* =================================================
                           TRANSFER MATRIX
        
                           Rows AND columns both use visibleStores, so
                           the grid stays square - a store missing
                           capacity for this brand is hidden as both a
                           source and a destination, not just one side.
                           ================================================= */

                        <div className="matrix-card">

                            <div className="table-scroll">

                                <table>

                                    <thead>

                                        <tr>

                                            <th className="corner-head">
                                                From \ To
                                            </th>


                                            {visibleStores.map(
                                                renderStoreHeader
                                            )}


                                            <th className="actions-head">

                                            </th>

                                        </tr>

                                    </thead>


                                    <tbody>

                                        {visibleStores.map(
                                            fromStore => {

                                                const count =
                                                    rowTransferCount(
                                                        fromStore.id
                                                    );


                                                return (

                                                    <tr
                                                        key={
                                                            fromStore.id
                                                        }
                                                    >

                                                        {/* =================
                                                    ROW NAME
                                                    ================= */}

                                                        <td
                                                            className="row-name-cell"
                                                        >

                                                            <div
                                                                className="store-label"
                                                                title={
                                                                    fromStore.name
                                                                }
                                                            >
                                                                {
                                                                    fromStore.name
                                                                }
                                                            </div>

                                                        </td>


                                                        {/* =================
                                                    TRANSFER CELLS
                                                    ================= */}

                                                        {visibleStores.map(
                                                            toStore =>
                                                                renderCell(
                                                                    fromStore,
                                                                    toStore
                                                                )
                                                        )}


                                                        {/* =================
                                                    ROW DELETE
                                                    ================= */}

                                                        <td
                                                            className="actions-cell"
                                                        >

                                                            <button
                                                                type="button"
                                                                className="row-action-btn"

                                                                disabled={
                                                                    count === 0
                                                                }

                                                                onClick={() =>
                                                                    deleteRowTransfers(
                                                                        fromStore.id
                                                                    )
                                                                }

                                                                title={
                                                                    count
                                                                        ? `Delete all ${count} active transfer(s) in this row`
                                                                        : "No active transfers in this row"
                                                                }
                                                            >
                                                                ტრანსფერის წაშლა
                                                            </button>


                                                            <span className="row-count">
                                                                {count} active
                                                            </span>

                                                        </td>

                                                    </tr>

                                                );
                                            }
                                        )}

                                    </tbody>

                                </table>

                            </div>

                        </div>

                    )}

                </div>
            );
        }


        /* ================================================================
           MOUNT REACT
           ================================================================ */

        ReactDOM
            .createRoot(
                document.getElementById("root")
            )
            .render(
                <App />
            );

    </script>

</body>

</html>

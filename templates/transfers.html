<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transfers</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap');

        :root {
            --black: #111111;
            --white: #ffffff;
            --off-white: #fafaf9;
            --g50: #f7f6f4;
            --g100: #edece8;
            --g200: #dddbd5;
            --g300: #b8b6b0;
            --g400: #8a8884;
            --g500: #6b6966;
            --g600: #4a4845;
            --g700: #2d2c2a;

            --accent: #c8102e;
            --accent-dk: #a30d24;
            --accent-light: #fef2f2;

            --danger: #dc0000;
            --danger-light: #ffe0e0;
            --success: #1a6b35;
            --success-light: #ecfdf5;

            --font: "Noto Sans Georgian", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --border: var(--g200);
            --border-strong: var(--g300);
            --surface: var(--white);
            --surface-subtle: var(--g50);
            --text: var(--g700);
            --text-muted: var(--g500);
            --radius-sm: 5px;
            --radius-md: 7px;
            --shadow-card: 0 1px 2px rgba(17, 17, 17, 0.035), 0 4px 12px rgba(17, 17, 17, 0.025);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            color: var(--text);
            background: transparent;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            opacity: .48;
            cursor: not-allowed;
        }

        .container {
            width: 100%;
            padding: 1rem 0 2rem;
        }

            display: flex;
            align-items: center;
            gap: .6rem;
            margin-bottom: 1rem;
            color: var(--black);
            font-size: clamp(1.2rem, 2vw, 1.45rem);
            font-weight: 700;
            letter-spacing: -.035em;
        }

        h2::before {
            content: "";
            width: 3px;
            height: 1.5rem;
            flex: 0 0 auto;
            border-radius: 2px;
            background: var(--accent);
        }

        .toolbar-card,
        .order-card,
        .matrix-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
        }

        .toolbar-card {
            padding: .8rem .9rem;
            margin-bottom: .6rem;
        }

        .order-card {
            padding: .85rem .9rem;
            margin-bottom: .75rem;
        }

        .matrix-card {
            overflow: hidden;
        }

        .toolbar,
        .toolbar-left,
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: .5rem;
            flex-wrap: wrap;
        }

        .toolbar-right {
            margin-left: auto;
        }

        .toolbar-label,

            font-weight: 700;

        .order-item {

        td {

        .cell-content {
            display: inline-flex;

        .diagonal {

        .delete-btn {
            width: 18px;
            height: 18px;
            padding: 0;

            font-size: 14px;

        .delete-btn:hover {

        .cell-error {
            display: block;

        }

        .row-action-btn {

        @media (max-width: 1000px) {

            .corner-head,
            .row-name-cell {

            }

            .actions-head,

            }

            .quantity-input {

                height: 25px;

            }

            }

                padding: .16rem .2rem;
                font-size: .58rem;

                font-size: 7px;
            }

            }
        }

<body>

    <div id="root"></div>

    <!-- =============================================================
     REACT
     ============================================================= -->

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

        const {
            useEffect,
            useMemo,
            useState
        } = React;


        /* ================================================================
           DEFAULT STORE ORDER
           ================================================================ */

        const DEFAULT_STORE_ORDER = [
            "WH_Gamarj",
            "ShoeGal_9 Sab_CityMall",
            "ICR_Shoes_TB_Galery",
            "ICR_Shoes TB_Mall",
            "ShoeGal_ Batu_Gamsax",
            "ICR_Shoes East_Point",
            "ShoeGal_10 Vazha",
            "ShoeGal_ Chavch",
            "ICR_Shoes_ Batu_GR_Mall",
            "ICR_Shoes",
            "ICR_Shoes_2",
        ];

        const STORE_ORDER_KEY =
            "transfers-store-order-v3";


        /* ================================================================
           HELPERS
           ================================================================ */

        function normalizeStoreName(name) {
            return String(name ?? "")
                .replace(/_/g, " ")
                .replace(/\s+/g, " ")
                .trim()
                .toLowerCase();
        }


        function compactStoreName(name) {
            return normalizeStoreName(name)
                .replace(/[^a-z0-9]/g, "");
        }


        function cellKey(fromId, toId) {
            return `${Number(fromId)}-${Number(toId)}`;
        }


        function isWarehouse(store) {
            return String(store?.type ?? "")
                .trim()
                .toLowerCase() === "warehouse";
        }


        /* ================================================================
           QUANTITY VALIDATION
           ================================================================ */

        function validateQuantity(value) {

            const text =
                String(value ?? "").trim();

            /*
             * Empty input is allowed.
             * It simply means "no transfer".
             */
            if (text === "") {
                return {
                    value: "",
                    error: ""
                };
            }

            /*
             * Only positive whole numbers.
             */
            if (!/^\d+$/.test(text)) {
                return {
                    value: text,
                    error: "Whole number only"
                };
            }

            const number = Number(text);

            if (!Number.isSafeInteger(number)) {
                return {
                    value: text,
                    error: "Number is too large"
                };
            }

            if (number <= 0) {
                return {
                    value: text,
                    error: "Must be greater than 0"
                };
            }

            return {
                value: text,
                error: ""
            };
        }


        /* ================================================================
           API HELPER
           ================================================================
        
           207 is a real success (Multi-Status) - the backend committed
           some rows and rejected others in the same request. It must
           NOT be thrown as an error, or valid created transfers would
           never reach the UI. Only 4xx/5xx are treated as hard failures.
           ================================================================ */

        async function apiFetch(url, options = {}) {

            const response =
                await fetch(url, options);

            if (response.status === 401) {
                window.location.href = "/login";
                throw new Error("Not authenticated");
            }

            let data = null;

            try {
                data = await response.json();
            }
            catch (_) {

                if (!response.ok) {
                    throw new Error(
                        `Request failed: ${response.status}`
                    );
                }

                throw new Error(
                    "Server returned an invalid response."
                );
            }

            const isHardFailure =
                !response.ok &&
                response.status !== 207;

            if (isHardFailure) {

                if (data?.error) {
                    throw new Error(data.error);
                }

                if (Array.isArray(data?.errors)) {

                    throw new Error(
                        data.errors
                            .map(
                                item =>
                                    item?.error ||
                                    "Request error"
                            )
                            .join(", ")
                    );
                }

                throw new Error(
                    `Request failed: ${response.status}`
                );
            }

            return data;
        }


        /* ================================================================
           LOCAL STORAGE
           ================================================================ */

        function loadSavedStoreIds() {

            try {

                const value =
                    JSON.parse(
                        localStorage.getItem(
                            STORE_ORDER_KEY
                        )
                    );

                return Array.isArray(value)
                    ? value.map(Number)
                    : null;
            }
            catch (_) {
                return null;
            }
        }


        function saveStoreIds(stores) {

            localStorage.setItem(
                STORE_ORDER_KEY,
                JSON.stringify(
                    stores.map(
                        store => Number(store.id)
                    )
                )
            );
        }


        /* ================================================================
           DEFAULT ORDER MATCHING
           ================================================================ */

        function defaultOrderStores(stores) {

            const exactRanks =
                new Map(
                    DEFAULT_STORE_ORDER.map(
                        (name, index) => [
                            normalizeStoreName(name),
                            index
                        ]
                    )
                );

            const compactRanks =
                new Map(
                    DEFAULT_STORE_ORDER.map(
                        (name, index) => [
                            compactStoreName(name),
                            index
                        ]
                    )
                );

            return [...stores].sort((a, b) => {

                const aExact =
                    exactRanks.get(
                        normalizeStoreName(a.name)
                    );

                const bExact =
                    exactRanks.get(
                        normalizeStoreName(b.name)
                    );

                const aRank =
                    Number.isInteger(aExact)
                        ? aExact
                        : compactRanks.get(
                            compactStoreName(a.name)
                        );

                const bRank =
                    Number.isInteger(bExact)
                        ? bExact
                        : compactRanks.get(
                            compactStoreName(b.name)
                        );

                const aKnown =
                    Number.isInteger(aRank);

                const bKnown =
                    Number.isInteger(bRank);

                if (
                    aKnown &&
                    bKnown &&
                    aRank !== bRank
                ) {
                    return aRank - bRank;
                }

                if (aKnown && !bKnown) {
                    return -1;
                }

                if (!aKnown && bKnown) {
                    return 1;
                }

                return String(a.name)
                    .localeCompare(
                        String(b.name)
                    );
            });
        }


        /* ================================================================
           APPLY SAVED ORDER
           ================================================================ */

        function applySavedOrder(
            stores,
            savedIds
        ) {

            if (
                !Array.isArray(savedIds) ||
                !savedIds.length
            ) {
                return defaultOrderStores(stores);
            }

            const byId =
                new Map(
                    stores.map(
                        store => [
                            Number(store.id),
                            store
                        ]
                    )
                );

            const result = [];

            /*
             * First use the saved order.
             */
            for (const id of savedIds) {

                const store =
                    byId.get(Number(id));

                if (store) {
                    result.push(store);
                }
            }

            /*
             * New stores that weren't in the saved
             * order are appended.
             */
            for (const store of stores) {

                const exists =
                    result.some(
                        item =>
                            Number(item.id) ===
                            Number(store.id)
                    );

                if (!exists) {
                    result.push(store);
                }
            }

            return result;
        }


        /* ================================================================
           INITIAL STORE ORDER
           ================================================================ */

        function initialStoreOrder(stores) {

            const saved =
                loadSavedStoreIds();

            if (saved?.length) {

                return applySavedOrder(
                    stores,
                    saved
                );
            }

            const ordered =
                defaultOrderStores(stores);

            saveStoreIds(ordered);

            return ordered;
        }


        /* ================================================================
           CAPACITY RESPONSE CONVERSION
           ================================================================
        
           /capacities returns (confirmed against capacities.py):
        
           {
               "Store Name": {
                   "store_id": 1,
                   "brands": [
                       {
                           "brand": "Ecco",
                           "capacity": 5000
                       }
                   ]
               }
           }
        
           This is still used to populate the brand dropdown and to
           decide which stores are visible for a given brand
           (visibleStores) - it is NOT used for the free-space badge
           anymore, since it only holds raw capacity, not capacity
           minus stock minus inbound transfers.
        
           Convert it into:
        
           Map<storeId, Map<brand, capacity>>
           ================================================================ */

        function buildCapacityMap(rawData) {

            const result =
                new Map();

            if (
                !rawData ||
                typeof rawData !== "object"
            ) {
                return result;
            }

            for (
                const info of Object.values(rawData)
            ) {

                const storeId =
                    Number(info?.store_id);

                if (!Number.isInteger(storeId)) {
                    continue;
                }

                const brandMap =
                    new Map();

                const brandList =
                    Array.isArray(info?.brands)
                        ? info.brands
                        : [];

                for (
                    const item of brandList
                ) {

                    if (
                        typeof item?.brand !==
                        "string"
                    ) {
                        continue;
                    }

                    const capacity =
                        Number(item.capacity);

                    if (
                        Number.isFinite(capacity)
                    ) {
                        brandMap.set(
                            item.brand,
                            capacity
                        );
                    }
                }

                result.set(
                    storeId,
                    brandMap
                );
            }

            return result;
        }


        /* ================================================================
           FREE-SPACE RESPONSE CONVERSION
           ================================================================
        
           /capacity-check returns (confirmed against capacities.py):
        
           {
               "Store Name": {
                   "Ecco": 4700,
                   "Geox": 4700,
                   "Studio": 4700
               }
           }
        
           Free space is already fully computed server-side
           (capacity - current_stock - current_transfers), so the
           frontend does no subtraction of its own anymore.
        
           /capacity-check keys its response by STORE NAME, not
           store_id, so the stores list (already loaded via
           GET /stores) is used here to resolve each name back to
           its id - producing the same Map<storeId, Map<brand,...>>
           shape the badge rendering code already expects.
        
           Convert it into:
        
           Map<storeId, Map<brand, freeSpace>>
           ================================================================ */

        function buildFreeSpaceMap(rawData, stores) {

            const result =
                new Map();

            if (
                !rawData ||
                typeof rawData !== "object"
            ) {
                return result;
            }

            const idByName =
                new Map(
                    stores.map(
                        store => [
                            store.name,
                            Number(store.id)
                        ]
                    )
                );

            for (
                const [storeName, brandValues]
                of Object.entries(rawData)
            ) {

                const storeId =
                    idByName.get(storeName);

                if (!Number.isInteger(storeId)) {
                    continue;
                }

                const brandMap =
                    new Map();

                if (
                    brandValues &&
                    typeof brandValues === "object"
                ) {

                    for (
                        const [brand, freeSpace]
                        of Object.entries(brandValues)
                    ) {

                        const value =
                            Number(freeSpace);

                        if (Number.isFinite(value)) {
                            brandMap.set(brand, value);
                        }
                    }
                }

                result.set(
                    storeId,
                    brandMap
                );
            }

            return result;
        }


        /* ================================================================
           APP
           ================================================================ */

        function App() {

            /* ------------------------------------------------------------
               SERVER DATA
               ------------------------------------------------------------ */

            const [stores, setStores] =
                useState([]);

            const [transfers, setTransfers] =
                useState([]);

            const [capacities, setCapacities] =
                useState({});

            const [freeSpace, setFreeSpace] =
                useState({});


            /* ------------------------------------------------------------
               UI STATE
               ------------------------------------------------------------ */

            const [selectedBrand, setSelectedBrand] =
                useState("");

            const [showOrder, setShowOrder] =
                useState(false);

            const [loading, setLoading] =
                useState(true);

            const [submitting, setSubmitting] =
                useState(false);


            /* ------------------------------------------------------------
               DRAFT STATE
        
               Drafts are stored by BRAND, so switching brands does
               not erase quantities that haven't been submitted.
               ------------------------------------------------------------ */

            const [draftsByBrand, setDraftsByBrand] =
                useState({});


            /* ------------------------------------------------------------
               VALIDATION STATE
               ------------------------------------------------------------ */

            const [errorsByBrand, setErrorsByBrand] =
                useState({});


            /* ------------------------------------------------------------
               LAST SUBMIT ERRORS
        
               Rows the backend itself rejected (e.g. quantity <= 0)
               on the most recent submit. Cleared on the next submit
               attempt or brand change.
               ------------------------------------------------------------ */

            const [lastSubmitErrors, setLastSubmitErrors] =
                useState([]);


            /* ------------------------------------------------------------
               STATUS MESSAGE
               ------------------------------------------------------------ */

            const [status, setStatus] =
                useState({
                    type: "info",
                    text: ""
                });


            /* ============================================================
               LOAD DATA
        
               /capacity-check is loaded alongside the other three -
               it drives the free-space badge. A failure here is
               non-fatal to the rest of the page: the badge just
               falls back to "No capacity" if freeSpace stays empty.
               ============================================================ */

            useEffect(() => {
                loadPageData();
            }, []);


            async function loadPageData() {

                setLoading(true);

                setStatus({
                    type: "info",
                    text: ""
                });

                try {

                    const [
                        storesData,
                        transfersData,
                        capacityData,
                        freeSpaceData
                    ] = await Promise.all([

                        apiFetch("/stores"),

                        apiFetch("/transfers"),

                        apiFetch("/capacities"),

                        apiFetch("/capacity-check")
                    ]);


                    const storeList =
                        Array.isArray(storesData)
                            ? storesData
                            : [];


                    /*
                     * Apply default/saved ordering.
                     */
                    setStores(
                        initialStoreOrder(
                            storeList
                        )
                    );


                    /*
                     * Existing active transfers.
                     */
                    setTransfers(
                        Array.isArray(transfersData)
                            ? transfersData
                            : []
                    );


                    /*
                     * Capacity response (dropdown + visibleStores).
                     */
                    setCapacities(
                        capacityData || {}
                    );


                    /*
                     * Free-space response (badge values).
                     */
                    setFreeSpace(
                        freeSpaceData || {}
                    );

                }
                catch (error) {

                    setStatus({
                        type: "error",
                        text: error.message
                    });

                }
                finally {

                    setLoading(false);
                }
            }


            /* ============================================================
               REFRESH FREE SPACE ONLY
        
               Called after a transfer is submitted or deleted, so the
               badge reflects the new inbound total without a full
               page reload. Advisory only - never blocks the action
               that triggered it, and a failure here just leaves the
               previous badge values in place.
               ============================================================ */

            async function refreshFreeSpace() {

                try {

                    const freeSpaceData =
                        await apiFetch(
                            "/capacity-check"
                        );

                    setFreeSpace(
                        freeSpaceData || {}
                    );
                }
                catch (_) {

                    /*
                     * Advisory data only - do not surface
                     * an error to the user over this.
                     */
                }
            }


            /* ============================================================
               CAPACITY MAP (dropdown + visibleStores only)
               ============================================================ */

            const capacityMap =
                useMemo(
                    () =>
                        buildCapacityMap(
                            capacities
                        ),
                    [capacities]
                );


            /* ============================================================
               FREE SPACE MAP (badge values)
               ============================================================ */

            const freeSpaceMap =
                useMemo(
                    () =>
                        buildFreeSpaceMap(
                            freeSpace,
                            stores
                        ),
                    [freeSpace, stores]
                );

            /* ============================================================
               AVAILABLE BRANDS
               ============================================================ */

            const brands =
                useMemo(() => {

                    const values =
                        new Set();


                    /*
                     * Brands from existing transfers.
                     */
                    for (
                        const transfer of transfers
                    ) {

                        if (
                            typeof transfer?.brand ===
                            "string"
                        ) {

                            values.add(
                                transfer.brand
                            );
                        }
                    }


                    /*
                     * Brands from capacity data.
                     */
                    for (
                        const storeBrands
                        of capacityMap.values()
                    ) {

                        for (
                            const brand
                            of storeBrands.keys()
                        ) {

                            values.add(brand);
                        }
                    }


                    return [...values].sort(
                        (a, b) =>
                            a.localeCompare(b)
                    );

                }, [
                    transfers,
                    capacityMap
                ]);


            /* ============================================================
               DEFAULT SELECTED BRAND
               ============================================================ */

            useEffect(() => {

                if (!brands.length) {

                    setSelectedBrand("");

                    return;
                }

                if (
                    !selectedBrand ||
                    !brands.includes(
                        selectedBrand
                    )
                ) {

                    setSelectedBrand(
                        brands[0]
                    );
                }

            }, [
                brands,
                selectedBrand
            ]);


            /* ============================================================
               VISIBLE STORES FOR THE SELECTED BRAND
        
               A store is shown if either:
               - it is a warehouse (always shown), or
               - it has a BrandCapacity row for the selected brand
        
               Still driven by capacityMap (/capacities), unchanged.
               ============================================================ */

            const visibleStores =
                useMemo(() => {

                    if (!selectedBrand) {
                        return stores;
                    }

                    return stores.filter(store => {

                        if (isWarehouse(store)) {
                            return true;
                        }

                        const brandMap =
                            capacityMap.get(
                                Number(store.id)
                            );

                        return brandMap
                            ? brandMap.has(selectedBrand)
                            : false;
                    });

                }, [
                    stores,
                    capacityMap,
                    selectedBrand
                ]);


            /* ============================================================
               CURRENT BRAND DRAFTS
               ============================================================ */

            const currentDrafts =
                draftsByBrand[
                selectedBrand
                ] || {};


            /* ============================================================
               CURRENT BRAND ERRORS
               ============================================================ */

            const currentErrors =
                errorsByBrand[
                selectedBrand
                ] || {};


            /* ============================================================
               ACTIVE TRANSFERS BY CELL
               ============================================================ */

            const activeTransfersByCell =
                useMemo(() => {

                    const map =
                        new Map();

                    for (
                        const transfer of transfers
                    ) {

                        if (
                            transfer?.brand !==
                            selectedBrand
                        ) {
                            continue;
                        }

                        const key =
                            cellKey(
                                transfer.from_store_id,
                                transfer.to_store_id
                            );


                        /*
                         * There should only be one active
                         * transfer for a cell under the
                         * current UI design.
                         */
                        if (!map.has(key)) {

                            map.set(
                                key,
                                transfer
                            );
                        }
                    }

                    return map;

                }, [
                    transfers,
                    selectedBrand
                ]);


            /* ============================================================
               DRAFT FLAGS
               ============================================================ */

            const hasDrafts =
                Object.values(
                    currentDrafts
                ).some(
                    value =>
                        String(value).trim() !== ""
                );


            const hasDraftErrors =
                Object.keys(
                    currentErrors
                ).length > 0;


            /* ============================================================
               FREE SPACE LOOKUP
        
               Replaces the old capacityMinusInbound placeholder.
               Reads the fully server-computed value straight from
               freeSpaceMap - no client-side subtraction left.
               ============================================================ */

            function freeSpaceFor(storeId) {

                const brandMap =
                    freeSpaceMap.get(
                        Number(storeId)
                    );

                if (!brandMap) {
                    return null;
                }

                const value =
                    brandMap.get(
                        selectedBrand
                    );

                return value === undefined
                    ? null
                    : value;
            }
            /* ============================================================
               PASTE MULTIPLE VALUES
               
               Pastes a tab-separated row of values (copied from Excel)
               starting at one cell, filling rightward across the visible
               store columns in the order they're currently displayed.
               Stops at the first locked cell (active transfer) or diagonal
               (same store) instead of skipping past it.
               ============================================================ */

            function handlePaste(event, fromId, startColumnIndex) {

                const text =
                    event.clipboardData.getData("text");

                /*
                 * Only intercept an actual multi-value paste. A single
                 * value pasted normally should behave exactly like typing.
                 */
                const values =
                    text.split("\t").map(v => v.trim());

                if (values.length <= 1) {
                    return;
                }

                event.preventDefault();

                for (let i = 0; i < values.length; i++) {

                    const columnIndex =
                        startColumnIndex + i;

                    if (columnIndex >= visibleStores.length) {
                        break;
                    }

                    const toStore =
                        visibleStores[columnIndex];

                    const toId =
                        Number(toStore.id);

                    /*
                     * Diagonal (same store) or an existing active
                     * transfer: stop the fill here rather than
                     * skipping past it.
                     */
                    if (toId === fromId) {
                        break;
                    }

                    const key =
                        cellKey(fromId, toId);

                    if (activeTransfersByCell.has(key)) {
                        break;
                    }

                    updateDraft(fromId, toId, values[i]);
                }
            }

            /* ============================================================
               UPDATE DRAFT
               ============================================================ */

            function updateDraft(
                fromId,
                toId,
                value
            ) {

                const key =
                    cellKey(
                        fromId,
                        toId
                    );

                const parsed =
                    validateQuantity(value);


                /*
                 * Save the typed value.
                 */
                setDraftsByBrand(prev => ({

                    ...prev,

                    [selectedBrand]: {

                        ...(prev[selectedBrand] || {}),

                        [key]: parsed.value
                    }
                }));


                /*
                 * Save/remove validation error.
                 */
                setErrorsByBrand(prev => {

                    const next = {
                        ...(prev[selectedBrand] || {})
                    };


                    if (parsed.error) {

                        next[key] =
                            parsed.error;

                    }
                    else {

                        delete next[key];
                    }


                    return {

                        ...prev,

                        [selectedBrand]: next
                    };
                });


                setStatus({
                    type: "info",
                    text: ""
                });
            }


            /* ============================================================
               CLEAR DRAFT
               ============================================================ */

            function clearDraft(
                fromId,
                toId
            ) {

                const key =
                    cellKey(
                        fromId,
                        toId
                    );


                setDraftsByBrand(prev => {

                    const next = {
                        ...(prev[selectedBrand] || {})
                    };

                    delete next[key];

                    return {
                        ...prev,
                        [selectedBrand]: next
                    };
                });


                setErrorsByBrand(prev => {

                    const next = {
                        ...(prev[selectedBrand] || {})
                    };

                    delete next[key];

                    return {
                        ...prev,
                        [selectedBrand]: next
                    };
                });
            }


            /* ============================================================
               DELETE ONE TRANSFER
        
               Re-fetches free space after a successful delete, since
               removing an inbound transfer changes the badge value.
               ============================================================ */

            async function deleteTransfer(
                transfer
            ) {

                setStatus({
                    type: "info",
                    text: "Deleting transfer..."
                });


                try {

                    await apiFetch(
                        `/transfers/${Number(
                            transfer.id
                        )}`,
                        {
                            method: "DELETE"
                        }
                    );


                    /*
                     * Only remove it from client state
                     * after the server confirmed deletion.
                     */
                    setTransfers(prev =>
                        prev.filter(
                            item =>
                                Number(item.id) !==
                                Number(transfer.id)
                        )
                    );


                    clearDraft(
                        transfer.from_store_id,
                        transfer.to_store_id
                    );


                    /*
                     * Advisory refresh - badge reflects the
                     * removed transfer.
                     */
                    refreshFreeSpace();


                    setStatus({
                        type: "success",
                        text: "Transfer deleted."
                    });

                }
                catch (error) {

                    setStatus({
                        type: "error",
                        text:
                            `Delete failed: ${error.message}`
                    });
                }
            }


            /* ============================================================
               DELETE ALL TRANSFERS IN ONE ROW
        
               Re-fetches free space after the batch completes, once,
               rather than once per deleted transfer.
               ============================================================ */

            async function deleteRowTransfers(
                fromStoreId
            ) {

                const rowTransfers =
                    transfers.filter(
                        transfer =>
                            transfer?.brand ===
                            selectedBrand &&
                            Number(
                                transfer.from_store_id
                            ) === Number(fromStoreId)
                    );


                if (!rowTransfers.length) {

                    setStatus({
                        type: "info",
                        text:
                            "No active transfers in this row."
                    });

                    return;
                }


                const confirmed =
                    window.confirm(
                        `Delete all ${rowTransfers.length} active transfer(s) from this row?`
                    );


                if (!confirmed) {
                    return;
                }


                setStatus({
                    type: "info",
                    text:
                        "Deleting row transfers..."
                });


                /*
                 * allSettled is important here.
        
                 * Promise.all() would reject as soon as one
                 * DELETE fails, which could make the UI lose
                 * track of which individual requests actually
                 * succeeded.
        
                 * allSettled lets us process every result.
                 */
                const results =
                    await Promise.allSettled(
                        rowTransfers.map(
                            transfer =>
                                apiFetch(
                                    `/transfers/${Number(
                                        transfer.id
                                    )}`,
                                    {
                                        method: "DELETE"
                                    }
                                )
                        )
                    );


                const deletedIds = [];

                let failedCount = 0;


                results.forEach(
                    (result, index) => {

                        if (
                            result.status ===
                            "fulfilled"
                        ) {

                            deletedIds.push(
                                Number(
                                    rowTransfers[
                                        index
                                    ].id
                                )
                            );

                        }
                        else {

                            failedCount++;
                        }
                    }
                );


                /*
                 * Remove only transfers whose DELETE
                 * actually succeeded.
                 */
                if (deletedIds.length) {

                    setTransfers(prev =>
                        prev.filter(
                            item =>
                                !deletedIds.includes(
                                    Number(item.id)
                                )
                        )
                    );
                }


                /*
                 * Advisory refresh - badge reflects whatever
                 * actually got deleted.
                 */
                if (deletedIds.length) {

                    refreshFreeSpace();
                }


                if (failedCount) {

                    setStatus({
                        type: "error",
                        text:
                            `${deletedIds.length} deleted, ${failedCount} failed.`
                    });

                }
                else {

                    setStatus({
                        type: "success",
                        text:
                            `${deletedIds.length} transfer(s) deleted.`
                    });
                }
            }


            /* ============================================================
               SUBMIT NEW TRANSFERS
               ============================================================
        
               The backend returns { errors: [...], created: [...] }
               on every outcome (201, 207, or 400). 207 means partial
               success - some rows were committed and some were
               rejected by the backend itself (e.g. quantity <= 0
               slipping past client validation, or from == to). Those
               backend-side errors are shown to the manager via
               lastSubmitErrors, separate from the client-side
               per-cell validation errors in errorsByBrand.
        
               Free space is re-fetched after any row is actually
               created - advisory only, matches the decision that the
               backend never calls /capacity-check during POST
               /transfers itself.
               ============================================================ */

            async function submitTransfers() {

                if (
                    !selectedBrand ||
                    submitting
                ) {
                    return;
                }


                const payload = [];

                const validationErrors = {};


                /*
                 * Walk through every draft for this brand.
                 */
                for (
                    const [
                        key,
                        value
                    ]
                    of Object.entries(
                        currentDrafts
                    )
                ) {

                    /*
                     * Blank cells are ignored.
                     */
                    if (
                        String(value).trim() === ""
                    ) {
                        continue;
                    }


                    const parsed =
                        validateQuantity(value);


                    /*
                     * Never silently ignore invalid
                     * user input.
                     */
                    if (parsed.error) {

                        validationErrors[key] =
                            parsed.error;

                        continue;
                    }


                    /*
                     * Existing active transfers are
                     * locked and must never be submitted
                     * a second time.
                     */
                    if (
                        activeTransfersByCell.has(
                            key
                        )
                    ) {
                        continue;
                    }


                    const separatorIndex =
                        key.indexOf("-");


                    const fromId =
                        Number(
                            key.slice(
                                0,
                                separatorIndex
                            )
                        );


                    const toId =
                        Number(
                            key.slice(
                                separatorIndex + 1
                            )
                        );


                    payload.push({

                        brand:
                            selectedBrand,

                        quantity:
                            Number(value),

                        from_store_id:
                            fromId,

                        to_store_id:
                            toId
                    });
                }


                /*
                 * Stop everything if any draft is invalid
                 * on the client side, before it even reaches
                 * the network.
                 */
                if (
                    Object.keys(
                        validationErrors
                    ).length
                ) {

                    setErrorsByBrand(prev => ({

                        ...prev,

                        [selectedBrand]:
                            validationErrors
                    }));


                    setStatus({
                        type: "error",
                        text:
                            "Fix the highlighted quantities before submitting."
                    });

                    return;
                }


                if (!payload.length) {

                    setStatus({
                        type: "info",
                        text:
                            "There are no new transfers to submit."
                    });

                    return;
                }


                setSubmitting(true);

                setLastSubmitErrors([]);

                setStatus({
                    type: "info",
                    text:
                        "Submitting transfers..."
                });


                try {

                    /*
                     * Flask endpoint expects:
        
                     * { "transfers": [...] }
        
                     * and returns:
        
                     * { "errors": [...], "created": [...] }
                     */
                    const result =
                        await apiFetch(
                            "/transfers",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        transfers:
                                            payload
                                    })
                            }
                        );


                    const createdTransfers =
                        Array.isArray(result?.created)
                            ? result.created
                            : [];

                    const backendErrors =
                        Array.isArray(result?.errors)
                            ? result.errors
                            : [];


                    /*
                     * Flask returns the actual DB IDs.
        
                     * Add them to server state so those
                     * cells immediately become locked -
                     * this happens even on a partial
                     * (207) success.
                     */
                    if (createdTransfers.length) {

                        setTransfers(prev => [
                            ...prev,
                            ...createdTransfers
                        ]);
                    }


                    /*
                     * Only clear the drafts that were
                     * actually created. A row rejected by
                     * the backend (e.g. quantity <= 0)
                     * stays in the draft so the manager can
                     * see and fix it, matched up against
                     * backendErrors below.
                     */
                    const createdKeys =
                        new Set(
                            createdTransfers.map(
                                t =>
                                    cellKey(
                                        t.from_store_id,
                                        t.to_store_id
                                    )
                            )
                        );

                    setDraftsByBrand(prev => {

                        const next = {
                            ...(prev[selectedBrand] || {})
                        };

                        for (
                            const key of createdKeys
                        ) {
                            delete next[key];
                        }

                        return {
                            ...prev,
                            [selectedBrand]: next
                        };
                    });


                    setLastSubmitErrors(
                        backendErrors
                    );


                    /*
                     * Advisory refresh - only meaningful if
                     * something was actually created.
                     */
                    if (createdTransfers.length) {

                        refreshFreeSpace();
                    }


                    if (
                        createdTransfers.length &&
                        backendErrors.length
                    ) {

                        setStatus({
                            type: "error",
                            text:
                                `${createdTransfers.length} submitted, ${backendErrors.length} rejected - see below.`
                        });

                    }
                    else if (backendErrors.length) {

                        setStatus({
                            type: "error",
                            text:
                                `All rows rejected - see below.`
                        });

                    }
                    else {

                        setStatus({
                            type: "success",
                            text:
                                `${createdTransfers.length} transfer(s) submitted.`
                        });
                    }

                }
                catch (error) {

                    /*
                     * Keep drafts intact on a hard failure
                     * (network error, 400 with no created
                     * rows, etc). The user can fix/retry them.
                     */
                    setStatus({
                        type: "error",
                        text:
                            `Submit failed: ${error.message}`
                    });

                }
                finally {

                    setSubmitting(false);
                }
            }


            /* ============================================================
               MOVE STORE
               ============================================================ */

            function moveStore(
                index,
                direction
            ) {

                setStores(prev => {

                    const next =
                        [...prev];

                    const target =
                        index + direction;


                    if (
                        target < 0 ||
                        target >= next.length
                    ) {
                        return prev;
                    }


                    [
                        next[index],
                        next[target]
                    ] = [
                            next[target],
                            next[index]
                        ];


                    /*
                     * Save real database IDs.
                     */
                    saveStoreIds(next);


                    return next;
                });
            }


            /* ============================================================
               RESET STORE ORDER
               ============================================================ */

            function resetOrder() {

                const ordered =
                    defaultOrderStores(stores);

                saveStoreIds(ordered);

                setStores(ordered);


                setStatus({
                    type: "success",
                    text:
                        "Store order reset."
                });
            }



            async function logout() {

                try {
                    await apiFetch("/logout", { method: "POST" });
                }
                catch (_) {
                    /*
                     * Even if the request fails, send the user to the
                     * login page. If the session is still valid, the
                     * next protected call will tell them.
                     */
                }

                window.location.href = "/login";
            }

            /* ============================================================
               COUNT ACTIVE ROW TRANSFERS
               ============================================================ */

            function rowTransferCount(
                fromStoreId
            ) {

                return transfers.filter(
                    transfer =>
                        transfer?.brand ===
                        selectedBrand &&
                        Number(
                            transfer.from_store_id
                        ) === Number(fromStoreId)
                ).length;
            }


            /* ============================================================
               STORE HEADER
        
               Badge now reads directly from freeSpaceFor (real
               /capacity-check data) instead of the old
               capacityMinusInbound placeholder.
               ============================================================ */

            function renderStoreHeader(
                store
            ) {

                const value =
                    freeSpaceFor(
                        store.id
                    );


                let badge =
                    "No capacity";

                let badgeClass =
                    "missing";


                if (value !== null) {

                    badge =
                        `თავისუფალი ადგილი: ${value}`;

                    badgeClass =
                        value < 0
                            ? "negative"
                            : "";
                }


                return (

                    <th
                        key={store.id}
                        className="store-head"
                        title={store.name}
                    >

                        <div className="store-label">
                            {store.name}
                        </div>


                        <span
                            className={
                                `capacity-value ${badgeClass}`
                            }
                        >
                            {badge}
                        </span>

                    </th>
                );
            }


            /* ============================================================
               TRANSFER CELL
               ============================================================ */

            function renderCell(
                fromStore,
                toStore,
                toIndex
            ) {

                const fromId =
                    Number(fromStore.id);

                const toId =
                    Number(toStore.id);


                /*
                 * Same store = disabled diagonal.
                 */
                if (
                    fromId === toId
                ) {

                    return (

                        <td
                            key={toId}
                            className="diagonal"
                            aria-label="Same store"
                        >
                            —
                        </td>
                    );
                }


                const key =
                    cellKey(
                        fromId,
                        toId
                    );


                const transfer =
                    activeTransfersByCell.get(
                        key
                    );


                const value =
                    currentDrafts[key] ??
                    "";


                const error =
                    currentErrors[key] ||
                    "";


                /*
                 * --------------------------------------------------------
                 * ACTIVE TRANSFER
                 * --------------------------------------------------------
                 *
                 * Active transfer is locked.
                 *
                 * User can delete it using X.
                 */
                if (transfer) {

                    return (

                        <td key={toId}>

                            <div className="cell-content">

                                <input
                                    className="quantity-input locked"
                                    value={
                                        transfer.quantity
                                    }
                                    readOnly
                                    aria-label={
                                        `Active transfer from ${fromStore.name} to ${toStore.name}`
                                    }
                                    title={
                                        "Active transfer. Delete it to edit."
                                    }
                                />


                                <button
                                    type="button"
                                    className="delete-btn"
                                    title="Delete transfer"
                                    aria-label="Delete transfer"
                                    onClick={() =>
                                        deleteTransfer(
                                            transfer
                                        )
                                    }
                                >
                                    ×
                                </button>

                            </div>

                        </td>
                    );
                }


                /*
                 * --------------------------------------------------------
                 * NEW / DRAFT CELL
                 * --------------------------------------------------------
                 */

                return (

                    <td key={toId}>

                        <input
                            className={
                                `quantity-input ${error
                                    ? "invalid"
                                    : ""
                                }`
                            }

                            value={value}

                            onChange={
                                event =>
                                    updateDraft(
                                        fromId,
                                        toId,
                                        event.target.value
                                    )
                            }

                            onPaste={
                                event =>
                                    handlePaste(
                                        event,
                                        fromId,
                                        toIndex
                                    )
                            }

                            inputMode="numeric"

                            aria-label={
                                `Transfer from ${fromStore.name} to ${toStore.name}`
                            }

                            title={
                                error ||
                                "Enter quantity"
                            }
                        />


                        {error && (

                            <span className="cell-error">
                                {error}
                            </span>

                        )}

                    </td>
                );
            }


            /* ============================================================
               LOADING
               ============================================================ */

            if (loading) {

                return (

                    <div className="container">

                        <h2>
                            ტრანსფერები
                        </h2>


                        <div className="matrix-card">

                            <div className="loading">
                                იტვირთება მონაცემები...
                            </div>

                        </div>

                    </div>
                );
            }


            /* ============================================================
               MAIN UI
               ============================================================ */

            return (

                <div className="container">

                    <h2>
                        ტრანსფერები
                    </h2>


                    {/* ====================================================
                TOOLBAR
                ==================================================== */}

                    <div className="toolbar-card">

                        <div className="toolbar">

                            <div className="toolbar-left">

                                <span className="toolbar-label">
                                    ბრენდი
                                </span>


                                <select
                                    className="brand-select"
                                    value={selectedBrand}

                                    onChange={event => {

                                        setSelectedBrand(
                                            event.target.value
                                        );

                                        setLastSubmitErrors([]);

                                        setStatus({
                                            type: "info",
                                            text: ""
                                        });
                                    }}

                                    disabled={
                                        !brands.length
                                    }
                                >

                                    {!brands.length && (

                                        <option value="">
                                            No brands
                                        </option>

                                    )}


                                    {brands.map(
                                        brand => (

                                            <option
                                                key={brand}
                                                value={brand}
                                            >
                                                {brand}
                                            </option>

                                        )
                                    )}

                                </select>


                                <button
                                    type="button"
                                    className="action-btn"

                                    onClick={() =>
                                        setShowOrder(
                                            value => !value
                                        )
                                    }
                                >
                                    {
                                        showOrder
                                            ? "მაღაზიების წყობის დამალვა"
                                            : "მაღაზიების წყობის ჩვენება"
                                    }
                                </button>

                                <button
                                    type="button"
                                    className="action-btn"
                                    onClick={() => window.location.href = '/edit-capacities'}
                                >
                                    ტევადობების რედაქტირება
                                </button>

                            </div>
                            <button
                                type="button"
                                className="action-btn"
                                onClick={logout}
                            >
                                გასვლა
                            </button>

                            <div className="toolbar-right">

                                <button
                                    type="button"
                                    className="action-btn primary"

                                    disabled={
                                        !hasDrafts ||
                                        hasDraftErrors ||
                                        submitting ||
                                        !selectedBrand
                                    }

                                    onClick={
                                        submitTransfers
                                    }
                                >

                                    {
                                        submitting
                                            ? "Submitting..."
                                            : "ტრანსფერების დაფიქსირება"
                                    }

                                </button>

                            </div>

                        </div>

                    </div>


                    {/* ====================================================
                STATUS
                ==================================================== */}

                    <div
                        className={
                            `status ${status.type}`
                        }

                        role="status"

                        aria-live="polite"
                    >
                        {status.text}
                    </div>


                    {/* ====================================================
                BACKEND-REJECTED ROWS FROM THE LAST SUBMIT
        
                Distinct from per-cell client validation errors -
                these are rows the server itself refused (e.g.
                quantity <= 0, or from == to) after a 207/400
                response.
                ==================================================== */}

                    {lastSubmitErrors.length > 0 && (

                        <div className="submit-errors">

                            <div className="submit-errors-title">
                                {
                                    `${lastSubmitErrors.length} row(s) rejected by the server`
                                }
                            </div>

                            <ul className="submit-errors-list">

                                {lastSubmitErrors.map(
                                    (err, index) => (

                                        <li key={index}>
                                            {
                                                `Row ${err.index}: ${err.error}`
                                            }
                                        </li>

                                    )
                                )}

                            </ul>

                        </div>

                    )}


                    {/* ====================================================
                STORE ORDER PANEL
                ==================================================== */}

                    {showOrder && (

                        <div className="order-card">

                            <div className="order-header">

                                <span className="section-label">
                                    Store order
                                </span>


                                <button
                                    type="button"
                                    className="action-btn reset-btn"
                                    onClick={resetOrder}
                                >
                                    Reset default
                                </button>

                            </div>


                            <div className="order-list">

                                {stores.map(
                                    (store, index) => (

                                        <div
                                            className="order-item"
                                            key={store.id}
                                        >

                                            <span className="order-number">
                                                {index + 1}
                                            </span>


                                            <span
                                                className="order-name"
                                                title={store.name}
                                            >
                                                {store.name}
                                            </span>


                                            <button
                                                type="button"
                                                className="move-btn"

                                                disabled={
                                                    index === 0
                                                }

                                                onClick={() =>
                                                    moveStore(
                                                        index,
                                                        -1
                                                    )
                                                }

                                                aria-label={
                                                    `Move ${store.name} up`
                                                }

                                                title="Move up"
                                            >
                                                ↑
                                            </button>


                                            <button
                                                type="button"
                                                className="move-btn"

                                                disabled={
                                                    index ===
                                                    stores.length - 1
                                                }

                                                onClick={() =>
                                                    moveStore(
                                                        index,
                                                        1
                                                    )
                                                }

                                                aria-label={
                                                    `Move ${store.name} down`
                                                }

                                                title="Move down"
                                            >
                                                ↓
                                            </button>

                                        </div>

                                    )
                                )}

                            </div>

                        </div>

                    )}


                    {/* ====================================================
                NO STORES
                ==================================================== */}

                    {!stores.length ? (

                        <div className="matrix-card">

                            <div className="empty-state">
                                No stores returned by /stores.
                            </div>

                        </div>

                    ) : !selectedBrand ? (

                        <div className="matrix-card">

                            <div className="empty-state">
                                No brand data available.
                            </div>

                        </div>

                    ) : !visibleStores.length ? (

                        <div className="matrix-card">

                            <div className="empty-state">
                                No stores have capacity configured for {selectedBrand}.
                            </div>

                        </div>

                    ) : (

                        /* =================================================
                           TRANSFER MATRIX
        
                           Rows AND columns both use visibleStores, so
                           the grid stays square - a store missing
                           capacity for this brand is hidden as both a
                           source and a destination, not just one side.
                           ================================================= */

                        <div className="matrix-card">

                            <div className="table-scroll">

                                <table>

                                    <thead>

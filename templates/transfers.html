<!DOCTYPE html>
<html lang="en">

    <title>Transfers</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap');

        :root {
            --black: #111111;
            --white: #ffffff;
            --off-white: #fafaf9;
            --g50: #f7f6f4;
            --g100: #edece8;
            --g200: #dddbd5;
            --g300: #b8b6b0;
            --g400: #8a8884;
            --g500: #6b6966;
            --g600: #4a4845;
            --g700: #2d2c2a;

            --accent-dk: #a30d24;
            --accent-light: #fef2f2;

            --danger: #dc0000;
            --danger-light: #ffe0e0;
            --success: #1a6b35;
            --success-light: #ecfdf5;

            --font: "Noto Sans Georgian", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --border: var(--g200);
            --border-strong: var(--g300);
            --surface: var(--white);
            --surface-subtle: var(--g50);
            --text: var(--g700);
            --text-muted: var(--g500);
            --radius-sm: 5px;
            --radius-md: 7px;

        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            color: var(--text);
            background: transparent;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }



        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            opacity: .48;
            cursor: not-allowed;
        }

        .container {
            width: 100%;
            padding: 1rem 0 2rem;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: .6rem 0;
            margin-bottom: .75rem;
            border-bottom: 1px solid var(--border);
        }

        .nav-spacer {

        .action-btn.current {

            border-color: var(--black);
            color: var(--white);

        }

        h2 {
            display: flex;
            align-items: center;
            gap: .6rem;
            margin-bottom: 1rem;
            color: var(--black);
            font-size: clamp(1.2rem, 2vw, 1.45rem);
            font-weight: 700;
            letter-spacing: -.035em;
        }

        h2::before {

            width: 3px;
            height: 1.5rem;
            flex: 0 0 auto;
            border-radius: 2px;
            background: var(--accent);
        }

        .toolbar-card,

            background: var(--surface);

            border-radius: var(--radius-md);

        .toolbar-card {

        }

        .toolbar,

        .delete-btn {

        .cell-error {

        .row-action-btn {

            border-radius: var(--radius-sm);

<body>

    <div id="root"></div>





    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
        integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
        integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.14/babel.min.js"
        integrity="sha384-NFMPdlT9NRMyYGArFJIgafm5emdRea6aGKLXhUrnDhERRKmOn3QJsnCiZpc1+CD9"
        crossorigin="anonymous"></script>

    <script type="text/babel">
        const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

        const {
            useEffect,
            useMemo,
            useRef,
            useState
        } = React;

        const BRANDS_BY_SEGMENT = {{ brands_by_segment | tojson }};
        const EMPTY_TRANSFER_OPTIONS = { sources: [], destinations: [] };






        const DEFAULT_STORE_ORDER = [
            "WH_Gamarj",
            "ShoeGal_9 Sab_CityMall",
            "ICR_Shoes_TB_Galery",
            "ICR_Shoes TB_Mall",
            "ShoeGal_ Batu_Gamsax",
            "ICR_Shoes East_Point",
            "ShoeGal_10 Vazha",
            "ShoeGal_ Chavch",
            "ICR_Shoes_ Batu_GR_Mall",
            "ICR_Shoes",
            "ICR_Shoes_2",
        ];

        const STORE_ORDER_KEY =
            "transfers-store-order-v3";






        function normalizeStoreName(name) {
            return String(name ?? "")
                .replace(/_/g, " ")
                .replace(/\s+/g, " ")
                .trim()
                .toLowerCase();
        }


        function compactStoreName(name) {
            return normalizeStoreName(name)
                .replace(/[^a-z0-9]/g, "");
        }


        function cellKey(fromId, toId) {
            return `${Number(fromId)}-${Number(toId)}`;
        }


        function isWarehouse(store) {
            return String(store?.type ?? "")
                .trim()
                .toLowerCase() === "warehouse";
        }






        function validateQuantity(value) {

            const text =
                String(value ?? "").trim();





            if (text === "") {
                return {
                    value: "",
                    error: ""
                };
            }




            if (!/^\d+$/.test(text)) {
                return {
                    value: text,
                    error: "Whole number only"
                };
            }

            const number = Number(text);

            if (!Number.isSafeInteger(number) || number > 2147483647) {
                return {
                    value: text,
                    error: "Number is too large"
                };
            }

            if (number <= 0) {
                return {
                    value: text,
                    error: "Must be greater than 0"
                };
            }

            return {
                value: text,
                error: ""
            };
        }












        async function apiFetch(url, options = {}) {

            const response =
                await fetch(url, {
                    ...options,
                    headers: { ...options.headers, "X-CSRFToken": csrfToken },
                });

            if (response.status === 401) {
                window.location.href = "/login";
                throw new Error("Not authenticated");
            }

            let data = null;

            try {
                data = await response.json();
            }
            catch (_) {

                if (!response.ok) {
                    throw new Error(
                        `Request failed: ${response.status}`
                    );
                }

                throw new Error(
                    "Server returned an invalid response."
                );
            }

            const isHardFailure =
                !response.ok &&
                response.status !== 207;

            if (isHardFailure) {

                if (data?.error) {
                    throw new Error(data.error);
                }

                if (Array.isArray(data?.errors)) {

                    throw new Error(
                        data.errors
                            .map(
                                item =>
                                    item?.error ||
                                    "Request error"
                            )
                            .join(", ")
                    );
                }

                throw new Error(
                    `Request failed: ${response.status}`
                );
            }

            return data;
        }






        function loadSavedStoreIds() {

            try {

                const value =
                    JSON.parse(
                        localStorage.getItem(
                            STORE_ORDER_KEY
                        )
                    );

                return Array.isArray(value)
                    ? value.map(Number)
                    : null;
            }
            catch (_) {
                return null;
            }
        }


        function saveStoreIds(stores) {

            localStorage.setItem(
                STORE_ORDER_KEY,
                JSON.stringify(
                    stores.map(
                        store => Number(store.id)
                    )
                )
            );
        }






        function defaultOrderStores(stores) {

            const exactRanks =
                new Map(
                    DEFAULT_STORE_ORDER.map(
                        (name, index) => [
                            normalizeStoreName(name),
                            index
                        ]
                    )
                );

            const compactRanks =
                new Map(
                    DEFAULT_STORE_ORDER.map(
                        (name, index) => [
                            compactStoreName(name),
                            index
                        ]
                    )
                );

            return [...stores].sort((a, b) => {

                const aExact =
                    exactRanks.get(
                        normalizeStoreName(a.name)
                    );

                const bExact =
                    exactRanks.get(
                        normalizeStoreName(b.name)
                    );

                const aRank =
                    Number.isInteger(aExact)
                        ? aExact
                        : compactRanks.get(
                            compactStoreName(a.name)
                        );

                const bRank =
                    Number.isInteger(bExact)
                        ? bExact
                        : compactRanks.get(
                            compactStoreName(b.name)
                        );

                const aKnown =
                    Number.isInteger(aRank);

                const bKnown =
                    Number.isInteger(bRank);

                if (
                    aKnown &&
                    bKnown &&
                    aRank !== bRank
                ) {
                    return aRank - bRank;
                }

                if (aKnown && !bKnown) {
                    return -1;
                }

                if (!aKnown && bKnown) {
                    return 1;
                }

                return String(a.name)
                    .localeCompare(
                        String(b.name)
                    );
            });
        }






        function applySavedOrder(
            stores,
            savedIds
        ) {

            if (
                !Array.isArray(savedIds) ||
                !savedIds.length
            ) {
                return defaultOrderStores(stores);
            }

            const byId =
                new Map(
                    stores.map(
                        store => [
                            Number(store.id),
                            store
                        ]
                    )
                );

            const result = [];




            for (const id of savedIds) {

                const store =
                    byId.get(Number(id));

                if (store) {
                    result.push(store);
                }
            }





            for (const store of stores) {

                const exists =
                    result.some(
                        item =>
                            Number(item.id) ===
                            Number(store.id)
                    );

                if (!exists) {
                    result.push(store);
                }
            }

            return result;
        }






        function initialStoreOrder(stores) {

            const saved =
                loadSavedStoreIds();

            if (saved?.length) {

                return applySavedOrder(
                    stores,
                    saved
                );
            }

            const ordered =
                defaultOrderStores(stores);

            saveStoreIds(ordered);

            return ordered;
        }





        function App() {





            const [stores, setStores] =
                useState([]);

            const [transfers, setTransfers] =
                useState([]);

            const [optionsResult, setOptionsResult] = useState(null);
            const optionsRequest = useRef(null);






            const [selectedBrand, setSelectedBrand] =
                useState("");

            const [selectedSegment, setSelectedSegment] =
                useState("ADULTS");

            const currentOptionsResult =
                optionsResult?.brand === selectedBrand && optionsResult.segment === selectedSegment
                    ? optionsResult
                    : null;
            const transferOptions = currentOptionsResult?.data ?? EMPTY_TRANSFER_OPTIONS;

            const [draggedStoreId, setDraggedStoreId] =
                useState(null);

            const [dragOverStoreId, setDragOverStoreId] =
                useState(null);

            const [loading, setLoading] =
                useState(true);

            const [submitting, setSubmitting] =
                useState(false);









            const [draftsByBrand, setDraftsByBrand] =
                useState({});






            const [errorsByBrand, setErrorsByBrand] =
                useState({});










            const [lastSubmitErrors, setLastSubmitErrors] =
                useState([]);






            const [status, setStatus] =
                useState({
                    type: "info",
                    text: ""
                });






            useEffect(() => {
                loadPageData();
            }, []);

            useEffect(() => {
                optionsRequest.current = selectedBrand
                    ? { brand: selectedBrand, segment: selectedSegment }
                    : null;
                loadTransferOptions();
                return () => {
                    optionsRequest.current = null;
                };
            }, [selectedBrand, selectedSegment]);


            async function loadTransferOptions() {
                const selection = optionsRequest.current;
                if (!selection) {
                    return;
                }

                const { brand, segment } = selection;
                const request = { brand, segment };
                optionsRequest.current = request;
                setOptionsResult({ ...request, status: "loading" });

                try {
                    const data = await apiFetch(
                        `/transfer-options?brand=${encodeURIComponent(brand)}&segment=${encodeURIComponent(segment)}`
                    );
                    if (!Array.isArray(data?.sources) || !Array.isArray(data?.destinations)) {
                        throw new Error("Invalid transfer options response.");
                    }
                    if (optionsRequest.current === request) {
                        setOptionsResult({ ...request, status: "ready", data });
                    }
                } catch (_) {
                    if (optionsRequest.current === request) {
                        setOptionsResult({ ...request, status: "error" });
                    }
                }
            }


            async function loadPageData() {

                setLoading(true);

                setStatus({
                    type: "info",
                    text: ""
                });

                try {

                    const [
                        storesData,
                        transfersData
                    ] = await Promise.all([

                        apiFetch("/stores"),

                        apiFetch("/transfers")
                    ]);


                    const storeList =
                        Array.isArray(storesData)
                            ? storesData
                            : [];





                    setStores(
                        initialStoreOrder(
                            storeList
                        )
                    );





                    setTransfers(
                        Array.isArray(transfersData)
                            ? transfersData
                            : []
                    );

                }
                catch (error) {

                    setStatus({
                        type: "error",
                        text: error.message
                    });

                }
                finally {

                    setLoading(false);
                }
            }






            const brands = BRANDS_BY_SEGMENT[selectedSegment] || [];






            useEffect(() => {

                if (!brands.length) {

                    setSelectedBrand("");

                    return;
                }

                if (
                    !selectedBrand ||
                    !brands.includes(
                        selectedBrand
                    )
                ) {

                    setSelectedBrand(
                        brands[0]
                    );
                }

            }, [
                brands,
                selectedBrand
            ]);












            const visibleStores =
                useMemo(() => {
                    if (!selectedBrand) {
                        return [];
                    }

                    const rankById = new Map(
                        stores.map((store, index) => [Number(store.id), index])
                    );

                    return [...transferOptions.sources].sort(
                        (left, right) =>
                            (rankById.get(Number(left.id)) ?? Number.MAX_SAFE_INTEGER) -
                            (rankById.get(Number(right.id)) ?? Number.MAX_SAFE_INTEGER)
                    );

                }, [
                    transferOptions,
                    selectedBrand,
                    stores
                ]);

            const destinationStores = useMemo(() => {
                if (!selectedBrand) {
                    return [];
                }

                const rankById = new Map(
                    stores.map((store, index) => [Number(store.id), index])
                );

                return [...transferOptions.destinations].sort(
                    (left, right) =>
                        (rankById.get(Number(left.id)) ?? Number.MAX_SAFE_INTEGER) -
                        (rankById.get(Number(right.id)) ?? Number.MAX_SAFE_INTEGER)
                );
            }, [transferOptions, selectedBrand, stores]);






            const currentDrafts =
                draftsByBrand[
                selectedBrand
                ] || {};






            const currentErrors =
                errorsByBrand[
                selectedBrand
                ] || {};






            const activeTransfersByCell =
                useMemo(() => {

                    const map =
                        new Map();

                    for (
                        const transfer of transfers
                    ) {

                        if (transfer?.brand !== selectedBrand || transfer?.segment !== selectedSegment) {
                            continue;
                        }

                        const key =
                            cellKey(
                                transfer.from_store_id,
                                transfer.to_store_id
                            );







                        if (!map.has(key)) {

                            map.set(
                                key,
                                transfer
                            );
                        }
                    }

                    return map;

                }, [
                    transfers,
                    selectedBrand,
                    selectedSegment
                ]);






            const hasDrafts =
                Object.values(
                    currentDrafts
                ).some(
                    value =>
                        String(value).trim() !== ""
                );


            const hasDraftErrors =
                Object.keys(
                    currentErrors
                ).length > 0;








            function freeSpaceFor(storeId) {
                const destination = transferOptions.destinations.find(
                    store => Number(store.id) === Number(storeId)
                );
                return typeof destination?.free_space === "number"
                    ? destination.free_space
                    : null;
            }










            function handlePaste(event, fromId, startColumnIndex) {

                const text =
                    event.clipboardData.getData("text");





                const values =
                    text.split("\t").map(v => v.trim());

                if (values.length <= 1) {
                    return;
                }

                event.preventDefault();

                for (let i = 0; i < values.length; i++) {

                    const columnIndex =
                        startColumnIndex + i;

                    if (columnIndex >= destinationStores.length) {
                        break;
                    }

                    const toStore =
                        destinationStores[columnIndex];

                    const toId =
                        Number(toStore.id);






                    if (toId === fromId) {
                        break;
                    }

                    const key =
                        cellKey(fromId, toId);

                    if (activeTransfersByCell.has(key)) {
                        break;
                    }

                    updateDraft(fromId, toId, values[i]);
                }
            }





            function updateDraft(
                fromId,
                toId,
                value
            ) {

                const key =
                    cellKey(
                        fromId,
                        toId
                    );

                const parsed =
                    validateQuantity(value);





                setDraftsByBrand(prev => ({

                    ...prev,

                    [selectedBrand]: {

                        ...(prev[selectedBrand] || {}),

                        [key]: parsed.value
                    }
                }));





                setErrorsByBrand(prev => {

                    const next = {
                        ...(prev[selectedBrand] || {})
                    };


                    if (parsed.error) {

                        next[key] =
                            parsed.error;

                    }
                    else {

                        delete next[key];
                    }


                    return {

                        ...prev,

                        [selectedBrand]: next
                    };
                });


                setStatus({
                    type: "info",
                    text: ""
                });
            }






            function clearDraft(
                fromId,
                toId
            ) {

                const key =
                    cellKey(
                        fromId,
                        toId
                    );


                setDraftsByBrand(prev => {

                    const next = {
                        ...(prev[selectedBrand] || {})
                    };

                    delete next[key];

                    return {
                        ...prev,
                        [selectedBrand]: next
                    };
                });


                setErrorsByBrand(prev => {

                    const next = {
                        ...(prev[selectedBrand] || {})
                    };

                    delete next[key];

                    return {
                        ...prev,
                        [selectedBrand]: next
                    };
                });
            }









            async function deleteTransfer(
                transfer
            ) {

                setStatus({
                    type: "info",
                    text: "Deleting transfer..."
                });


                try {

                    await apiFetch(
                        `/transfers/${Number(
                            transfer.id
                        )}`,
                        {
                            method: "DELETE"
                        }
                    );






                    setTransfers(prev =>
                        prev.filter(
                            item =>
                                Number(item.id) !==
                                Number(transfer.id)
                        )
                    );


                    clearDraft(
                        transfer.from_store_id,
                        transfer.to_store_id
                    );






                    loadTransferOptions();


                    setStatus({
                        type: "success",
                        text: "Transfer deleted."
                    });

                }
                catch (error) {

                    setStatus({
                        type: "error",
                        text:
                            `Delete failed: ${error.message}`
                    });
                }
            }









            async function deleteRowTransfers(
                fromStoreId
            ) {

                const rowTransfers =
                    transfers.filter(
                        transfer =>
                            transfer?.brand ===
                            selectedBrand && transfer?.segment === selectedSegment &&
                            Number(
                                transfer.from_store_id
                            ) === Number(fromStoreId)
                    );


                if (!rowTransfers.length) {

                    setStatus({
                        type: "info",
                        text:
                            "No active transfers in this row."
                    });

                    return;
                }


                const confirmed =
                    window.confirm(
                        `Delete all ${rowTransfers.length} active transfer(s) from this row?`
                    );


                if (!confirmed) {
                    return;
                }


                setStatus({
                    type: "info",
                    text:
                        "Deleting row transfers..."
                });












                const results =
                    await Promise.allSettled(
                        rowTransfers.map(
                            transfer =>
                                apiFetch(
                                    `/transfers/${Number(
                                        transfer.id
                                    )}`,
                                    {
                                        method: "DELETE"
                                    }
                                )
                        )
                    );


                const deletedIds = [];

                let failedCount = 0;


                results.forEach(
                    (result, index) => {

                        if (
                            result.status ===
                            "fulfilled"
                        ) {

                            deletedIds.push(
                                Number(
                                    rowTransfers[
                                        index
                                    ].id
                                )
                            );

                        }
                        else {

                            failedCount++;
                        }
                    }
                );






                if (deletedIds.length) {

                    setTransfers(prev =>
                        prev.filter(
                            item =>
                                !deletedIds.includes(
                                    Number(item.id)
                                )
                        )
                    );
                }






                if (deletedIds.length) {

                    loadTransferOptions();
                }


                if (failedCount) {

                    setStatus({
                        type: "error",
                        text:
                            `${deletedIds.length} deleted, ${failedCount} failed.`
                    });

                }
                else {

                    setStatus({
                        type: "success",
                        text:
                            `${deletedIds.length} transfer(s) deleted.`
                    });
                }
            }



















            async function submitTransfers() {

                if (
                    !selectedBrand ||
                    submitting
                ) {
                    return;
                }


                const payload = [];

                const validationErrors = {};





                for (
                    const [
                        key,
                        value
                    ]
                    of Object.entries(
                        currentDrafts
                    )
                ) {




                    if (
                        String(value).trim() === ""
                    ) {
                        continue;
                    }


                    const parsed =
                        validateQuantity(value);






                    if (parsed.error) {

                        validationErrors[key] =
                            parsed.error;

                        continue;
                    }







                    if (
                        activeTransfersByCell.has(
                            key
                        )
                    ) {
                        continue;
                    }


                    const separatorIndex =
                        key.indexOf("-");


                    const fromId =
                        Number(
                            key.slice(
                                0,
                                separatorIndex
                            )
                        );


                    const toId =
                        Number(
                            key.slice(
                                separatorIndex + 1
                            )
                        );


                    payload.push({

                        brand:
                            selectedBrand,

                        segment:
                            selectedSegment,

                        quantity:
                            Number(value),

                        from_store_id:
                            fromId,

                        to_store_id:
                            toId
                    });
                }







                if (
                    Object.keys(
                        validationErrors
                    ).length
                ) {

                    setErrorsByBrand(prev => ({

                        ...prev,

                        [selectedBrand]:
                            validationErrors
                    }));


                    setStatus({
                        type: "error",
                        text:
                            "Fix the highlighted quantities before submitting."
                    });

                    return;
                }


                if (!payload.length) {

                    setStatus({
                        type: "info",
                        text:
                            "There are no new transfers to submit."
                    });

                    return;
                }


                setSubmitting(true);

                setLastSubmitErrors([]);

                setStatus({
                    type: "info",
                    text:
                        "Submitting transfers..."
                });


                try {










                    const result =
                        await apiFetch(
                            "/transfers",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        transfers:
                                            payload
                                    })
                            }
                        );


                    const createdTransfers =
                        Array.isArray(result?.created)
                            ? result.created
                            : [];

                    const backendErrors =
                        Array.isArray(result?.errors)
                            ? result.errors
                            : [];










                    if (createdTransfers.length) {

                        setTransfers(prev => [
                            ...prev,
                            ...createdTransfers
                        ]);
                    }










                    const createdKeys =
                        new Set(
                            createdTransfers.map(
                                t =>
                                    cellKey(
                                        t.from_store_id,
                                        t.to_store_id
                                    )
                            )
                        );

                    setDraftsByBrand(prev => {

                        const next = {
                            ...(prev[selectedBrand] || {})
                        };

                        for (
                            const key of createdKeys
                        ) {
                            delete next[key];
                        }

                        return {
                            ...prev,
                            [selectedBrand]: next
                        };
                    });


                    setLastSubmitErrors(
                        backendErrors
                    );






                    if (createdTransfers.length) {

                        loadTransferOptions();
                    }


                    if (
                        createdTransfers.length &&
                        backendErrors.length
                    ) {

                        setStatus({
                            type: "error",
                            text:
                                `${createdTransfers.length} submitted, ${backendErrors.length} rejected - see below.`
                        });

                    }
                    else if (backendErrors.length) {

                        setStatus({
                            type: "error",
                            text:
                                `All rows rejected - see below.`
                        });

                    }
                    else {

                        setStatus({
                            type: "success",
                            text:
                                `${createdTransfers.length} transfer(s) submitted.`
                        });
                    }

                }
                catch (error) {






                    setStatus({
                        type: "error",
                        text:
                            `Submit failed: ${error.message}`
                    });

                }
                finally {

                    setSubmitting(false);
                }
            }


            function reorderStores(
                sourceStoreId,
                targetStoreId
            ) {

                if (sourceStoreId === targetStoreId) {
                    return;
                }

                setStores(prev => {

                    const sourceIndex = prev.findIndex(
                        store => Number(store.id) === Number(sourceStoreId)
                    );
                    const targetIndex = prev.findIndex(
                        store => Number(store.id) === Number(targetStoreId)
                    );

                    if (sourceIndex < 0 || targetIndex < 0) {
                        return prev;
                    }

                    const next = [...prev];
                    const [movedStore] = next.splice(sourceIndex, 1);
                    next.splice(targetIndex, 0, movedStore);
                    saveStoreIds(next);
                    return next;
                });
            }


            function handleStoreDragStart(event, storeId) {
                const numericStoreId = Number(storeId);
                setDraggedStoreId(numericStoreId);
                event.dataTransfer.effectAllowed = "move";
                event.dataTransfer.setData("text/plain", String(numericStoreId));
            }


            function handleStoreDragOver(event, storeId) {
                event.preventDefault();
                event.dataTransfer.dropEffect = "move";
                setDragOverStoreId(Number(storeId));
            }


            function handleStoreDrop(event, targetStoreId) {
                event.preventDefault();
                const sourceStoreId = Number(
                    event.dataTransfer.getData("text/plain") || draggedStoreId
                );
                reorderStores(sourceStoreId, Number(targetStoreId));
                setDraggedStoreId(null);
                setDragOverStoreId(null);
                setStatus({
                    type: "success",
                    text: "Store order saved."
                });
            }


            function handleStoreDragEnd() {
                setDraggedStoreId(null);
                setDragOverStoreId(null);
            }


            async function logout() {

                try {
                    await apiFetch("/logout", { method: "POST" });
                    window.location.href = "/login";
                }
                catch (_) {
                    setStatus({
                        type: "error",
                        text: "გასვლა ვერ მოხერხდა. განაახლეთ გვერდი და სცადეთ ხელახლა."
                    });
                }
            }





            function rowTransferCount(
                fromStoreId
            ) {

                return transfers.filter(
                    transfer =>
                        transfer?.brand ===
                        selectedBrand && transfer?.segment === selectedSegment &&
                        Number(
                            transfer.from_store_id
                        ) === Number(fromStoreId)
                ).length;
            }









            function renderStoreHeader(
                store
            ) {

                const value =
                    freeSpaceFor(
                        store.id
                    );


                let badge =
                    "No capacity";

                let badgeClass =
                    "missing";


                if (value !== null) {

                    badge =
                        `თავისუფალი ადგილი: ${value}`;

                    badgeClass =
                        value < 0
                            ? "negative"
                            : "";
                }


                return (

                    <th
                        key={store.id}
                        className={`store-head draggable-store ${
                            draggedStoreId === Number(store.id)
                                ? "dragging-store"
                                : ""
                        } ${
                            dragOverStoreId === Number(store.id) &&
                            draggedStoreId !== Number(store.id)
                                ? "drag-over-store"
                                : ""
                        }`}
                        draggable={true}
                        onDragStart={event =>
                            handleStoreDragStart(event, store.id)
                        }
                        onDragOver={event =>
                            handleStoreDragOver(event, store.id)
                        }
                        onDrop={event =>
                            handleStoreDrop(event, store.id)
                        }
                        onDragEnd={handleStoreDragEnd}
                        title={`Drag ${store.name} to reorder stores`}
                    >

                        <div className="store-label">
                            {store.name}
                        </div>


                        <span
                            className={
                                `capacity-value ${badgeClass}`
                            }
                        >
                            {badge}
                        </span>

                    </th>
                );
            }






            function renderCell(
                fromStore,
                toStore,
                toIndex
            ) {

                const fromId =
                    Number(fromStore.id);

                const toId =
                    Number(toStore.id);





                if (

                ) {

                    return (

                        >

                        </td>
                    );

                    cellKey(
                        fromId,
                        toId
                    );

                    activeTransfersByCell.get(
                        key
                    );


                const value =
                    currentDrafts[key] ??
                    "";


                const error =
                    currentErrors[key] ||
                    "";











                if (transfer) {

                    return (

                        <td key={toId}>

                            <div className="cell-content">

                                <input
                                    className="quantity-input locked"
                                    value={

                                    }
                                    readOnly
                                    aria-label={
                                        `Active transfer from ${fromStore.name} to ${toStore.name}`
                                    }
                                    title={
                                        "Active transfer. Delete it to edit."
                                    }
                                />


                                <button
                                    type="button"
                                    className="delete-btn"
                                    title="Delete transfer"
                                    aria-label="Delete transfer"

                                        )
                                    }
                                >

                                </button>

                }








                return (

                                `quantity-input ${error

                                    : ""
                                }`
                            }

                            value={value}

                                    updateDraft(

                                        toId,

                                    )
                            }

                                    )
                            }

                            inputMode="numeric"

                            }

            if (loading) {

                                იტვირთება მონაცემები...
                            </div>

                        </div>

                    </div>
                );
            }






            return (

                <div className="container">
                    <nav className="nav">
                        <a href="/import-stock" className="action-btn">ნაშთის განახლება</a>
                        <a href="/transfers-page" className="action-btn current">ტრანსფერები</a>
                        <a href="/edit-capacities" className="action-btn">ტევადობები</a>
                        <a href="/public-transfers" className="action-btn">ტრანსფერები (მაღაზიებისთვის)</a>
                        <button type="button" className="action-btn nav-spacer" onClick={logout}>გასვლა</button>
                    </nav>

                        ტრანსფერები
                    </h2>

}

                    <div className="toolbar-card">

                            <div className="toolbar-left">



                                <span className="toolbar-label">სქესი</span>

                                <select className="brand-select" value={selectedSegment} onChange={event => {
                                    setSelectedSegment(event.target.value);
                                    setSelectedBrand("");
                                    setLastSubmitErrors([]);
                                }}>
                                    <option value="ADULTS">Adults</option>
                                    <option value="KIDS">Kids</option>
                                </select>

                                <span className="toolbar-label">

                                </span>
                                <select

                                    value={selectedBrand}

                                    onChange={event => {

                                        setSelectedBrand(

                                        );

                                        setLastSubmitErrors([]);

}

                                                        <td

                                                                )
                                                        )}


                                                        {

}

                                                        <td

                                                        >

                                                            <button

                                                                className="row-action-btn"

                                                                disabled={

                                                                }

                                                                onClick={() =>

        ReactDOM

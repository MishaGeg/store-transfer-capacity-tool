services:
  app:
    restart: unless-stopped
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://store_runtime:${docker_pgs_password1:?Set docker_pgs_password1 in .env}@db:5432/store_transfer
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).close()" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    profiles: [ "tools" ]
    build: .
    entrypoint: [ "python", "-m", "flask", "--app", "app", "db" ]
    command: [ "upgrade" ]
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://store_app@db:5432/store_transfer
      PGPASSWORD: ${docker_pgs_password:?Set docker_pgs_password in .env}
      RATELIMIT_STORAGE_URI: memory://
    depends_on:
      db:
        condition: service_healthy

  db:
    restart: unless-stopped
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_DB: store_transfer
      POSTGRES_USER: store_app
      POSTGRES_PASSWORD: ${docker_pgs_password:?Set docker_pgs_password in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "store_app", "-d", "store_transfer" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    restart: unless-stopped
    image: redis:8.10.3-alpine
    command: [ "redis-server", "--save", "", "--appendonly", "no" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:

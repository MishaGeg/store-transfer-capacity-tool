<!DOCTYPE html>
<html>
<head>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
  color: var(--text-primary);
  background: transparent;
}

.container {
  padding: 1rem 0;
}

h2 {
  font-size: 18px;
  font-weight: 500;
  margin-bottom: 1.5rem;
  color: var(--text-primary);
}

.stores-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
}

.store-card {
  background: var(--surface-2);
  border: 0.5px solid var(--border);
  border-radius: 12px;
  padding: 1rem 1.25rem;
}

.store-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
  border-bottom: 0.5px solid var(--border);
  padding-bottom: 0.75rem;
}

.store-name {
  font-weight: 500;
  font-size: 15px;
  color: var(--text-primary);
}

.brands-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.brand-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
  padding: 8px;
  background: var(--surface-1);
  border-radius: var(--radius);
}

.brand-info {
  flex: 1;
}

.brand-label {
  color: var(--text-secondary);
  font-size: 12px;
  margin-bottom: 2px;
}

.brand-name {
  color: var(--text-primary);
  font-weight: 500;
}

.capacity-value {
  color: var(--text-primary);
  font-weight: 500;
  margin-right: 12px;
  min-width: 50px;
  text-align: right;
}

.edit-btn {
  background: transparent;
  border: 0.5px solid var(--border-strong);
  color: var(--text-primary);
  padding: 4px 8px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12px;
  transition: background 0.2s;
}

.edit-btn:hover {
  background: var(--surface-1);
}

.edit-btn:active {
  transform: scale(0.98);
}

.manage-btn {
  background: transparent;
  border: 0.5px solid var(--border-strong);
  color: var(--text-primary);
  padding: 0.5rem 1rem;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 1.5rem;
  transition: background 0.2s;
}

.manage-btn:hover {
  background: var(--surface-1);
}

.manage-btn:active {
  transform: scale(0.98);
}

.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  min-height: 400px;
}

.modal-overlay.open {
  display: flex;
}

.modal {
  background: #ffffff;
  border: 0.5px solid var(--border);
  border-radius: 12px;
  padding: 1.5rem;
  width: 90%;
  max-width: 500px;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.08);
}

.modal-header {
  font-size: 18px;
  font-weight: 500;
  margin-bottom: 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.close-btn {
  background: transparent;
  border: none;
  color: var(--text-primary);
  cursor: pointer;
  font-size: 20px;
  padding: 0;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.close-btn:hover {
  color: var(--text-secondary);
}

.form-group {
  margin-bottom: 1.25rem;
}

.form-group label {
  display: block;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 0.5rem;
  font-weight: 500;
}

.form-group input {
  width: 100%;
  padding: 0.5rem 0.75rem;
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px;
  background: var(--surface-1);
  color: var(--text-primary);
  transition: border-color 0.2s;
}

.form-group input:focus {
  outline: none;
  border-color: var(--border-strong);
  box-shadow: 0 0 0 2px var(--bg-accent);
}

.error-msg {
  color: var(--text-danger);
  font-size: 12px;
  margin-top: 0.25rem;
}

.modal-footer {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  margin-top: 1.5rem;
  padding-top: 1rem;
  border-top: 0.5px solid var(--border);
}

.btn-secondary {
  background: transparent;
  border: 0.5px solid var(--border-strong);
  color: var(--text-primary);
  padding: 0.5rem 1rem;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: background 0.2s;
}

.btn-secondary:hover {
  background: var(--surface-1);
}

.btn-primary {
  background: var(--fill-accent);
  border: 0.5px solid var(--fill-accent);
  color: var(--on-accent);
  padding: 0.5rem 1rem;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: background 0.2s;
}

.btn-primary:hover {
  background: var(--fill-accent-hover, #2563eb);
}

.btn-primary:active {
  transform: scale(0.98);
}

.btn-primary:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.loading {
  color: var(--text-secondary);
  font-size: 14px;
  text-align: center;
  padding: 2rem;
}

.empty-state {
  color: var(--text-secondary);
  font-size: 14px;
  text-align: center;
  padding: 2rem;
}
</style>
</head>
<body>

<div class="container">
  <h2>Store capacities</h2>
  
  
  <div id="storesContainer" class="stores-grid">
    <div class="loading">Loading store data...</div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <span>Edit capacity</span>
      <button class="close-btn" id="closeBtn">&times;</button>
    </div>
    
    <div class="form-group">
      <label>Store</label>
      <input type="text" id="storeNameField" readonly style="background: var(--surface-0); cursor: not-allowed;">
    </div>
    
    <div class="form-group">
      <label>Brand</label>
      <input type="text" id="brandField" readonly style="background: var(--surface-0); cursor: not-allowed;">
    </div>
    
    <div class="form-group">
      <label>Capacity</label>
      <input type="number" id="capacityField" placeholder="Enter capacity">
      <div class="error-msg" id="errorMsg"></div>
    </div>
    
    <div class="modal-footer">
      <button class="btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn-primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script>
let capacitiesData = {};
let currentEdit = null;

const API_BASE = 'http://localhost:5000';

async function fetchCapacities() {
  try {
    const response = await fetch(`${API_BASE}/capacities`);
    if (!response.ok) throw new Error('Failed to fetch capacities');
    return await response.json();
  } catch (err) {
    console.error('Error fetching capacities:', err);
    return {};
  }
}

function renderStores(data) {
  const container = document.getElementById('storesContainer');
  
  if (!data || Object.keys(data).length === 0) {
    container.innerHTML = '<div class="empty-state">No capacity data available.</div>';
    return;
  }
  
  const html = Object.entries(data)
    .map(([storeName, storeData]) => {
      const storeId = storeData.store_id;
      const brands = storeData.brands;

      return `
      <div class="store-card">
        <div class="store-header">
          <div class="store-name">${storeName}</div>
        </div>
        <div class="brands-list">
          ${brands.map(item => `
            <div class="brand-row">
              <div class="brand-info">
                <div class="brand-label">Brand</div>
                <div class="brand-name">${item.brand}</div>
              </div>
              <div class="capacity-value">${item.capacity}</div>
              <button class="edit-btn" data-store-id="${storeId}" data-store="${storeName}" data-brand="${item.brand}" data-capacity="${item.capacity}">
                <i class="ti ti-edit" style="font-size: 14px;" aria-hidden="true"></i> Edit
              </button>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    })
    .join('');
  
  container.innerHTML = html;
  
  document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const storeId = btn.getAttribute('data-store-id');
      const storeName = btn.getAttribute('data-store');
      const brand = btn.getAttribute('data-brand');
      const capacity = btn.getAttribute('data-capacity');
      openEditModal(storeId, storeName, brand, capacity);
    });
  });
}

function openEditModal(storeId, storeName, brand, capacity) {
  currentEdit = { storeId, storeName, brand, capacity };
  
  document.getElementById('storeNameField').value = storeName;
  document.getElementById('brandField').value = brand;
  document.getElementById('capacityField').value = capacity;
  document.getElementById('errorMsg').textContent = '';
  
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('capacityField').focus();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  currentEdit = null;
}

async function saveCapacity() {
  const errorMsg = document.getElementById('errorMsg');
  const newCapacity = document.getElementById('capacityField').value;
  
  if (!newCapacity || isNaN(newCapacity)) {
    errorMsg.textContent = 'Enter a valid number.';
    return;
  }
  
  errorMsg.textContent = '';
  
  const { storeId, brand } = currentEdit;
  
  if (!storeId) {
    errorMsg.textContent = 'Store ID not found.';
    return;
  }
  
  try {
    const response = await fetch(
      `${API_BASE}/capacities/${storeId}/${encodeURIComponent(brand)}`,
      {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ capacity: parseInt(newCapacity) })
      }
    );
    
    if (!response.ok) {
      const errData = await response.json();
      errorMsg.textContent = errData.error || 'Update failed.';
      return;
    }
    
    closeModal();
    const updated = await fetchCapacities();
    capacitiesData = updated;
    renderStores(updated);
  } catch (err) {
    errorMsg.textContent = 'Network error. Try again.';
    console.error(err);
  }
}

document.getElementById('closeBtn').addEventListener('click', closeModal);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
document.getElementById('saveBtn').addEventListener('click', saveCapacity);

document.getElementById('capacityField').addEventListener('input', () => {
  document.getElementById('errorMsg').textContent = '';
});

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modalOverlay')) {
    closeModal();
  }
});

(async () => {
  const data = await fetchCapacities();
  capacitiesData = data;
  renderStores(data);
})();
</script>

</body>
</html>

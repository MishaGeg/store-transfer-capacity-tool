name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7-bookworm
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: store_transfer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d store_transfer_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      SECRET_KEY: test-only-key
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Upgrade an empty PostgreSQL database to head
        run: python -m flask --app app db upgrade head
      - name: Run pytest against a separate database
        run: python -m pytest
